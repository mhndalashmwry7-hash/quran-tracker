<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0705;color:#e8b86a;font-family:serif;overflow:hidden}
body{display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#1d130b 0%,#0b0705 62%)}
#top{flex:none;padding:8px 12px 4px}
#head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;border-radius:20px;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
 border:1px solid rgba(240,207,142,.35);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.45);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#title{font-size:19px;color:#f6dca0;text-shadow:0 2px 12px rgba(232,184,106,.25);line-height:1.5}
#sub{font-size:11px;color:rgba(232,184,106,.65);line-height:1.3}
#pg{font-size:13px;color:#f0cf8e;padding:3px 11px;border-radius:12px;background:rgba(240,207,142,.1);border:1px solid rgba(240,207,142,.25)}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x pan-y;scrollbar-width:none;font-size:20px}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;position:relative;box-sizing:border-box;padding:6px 14px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;isolation:isolate}
.page::-webkit-scrollbar{display:none}
.zoom{position:relative;display:flow-root;transform-origin:50% 50%}
.inner{text-align:center;line-height:2.1}
.w{display:inline-block;position:relative;z-index:1;padding:0 2px;margin:1px 1px;opacity:.55;transition:opacity .3s,color .3s}
.w.on{opacity:1;color:#fff0cf}
.num{width:1.6em;height:1.6em;padding:0;margin:0 2px;vertical-align:middle;opacity:.85}
.num svg{position:absolute;inset:0;width:100%;height:100%}
.num b{position:absolute;inset:0;display:grid;place-items:center;font-size:.5em;font-weight:normal;color:#f6dca0;line-height:1;padding-top:.1em}
.num.on b{color:#fff}
.g{position:absolute;z-index:0;border-radius:999px;pointer-events:none;opacity:0;
 background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.07));
 border:1px solid rgba(255,255,255,.4);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 6px 18px rgba(0,0,0,.45);
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
 transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease,opacity .3s}
#bar{flex:none;height:76px;display:grid;place-items:center}
#b{position:relative;width:min(62vw,240px);height:50px;border-radius:25px;padding:0;margin:0;outline:none;overflow:hidden;cursor:pointer;
 color:#fff0cf;font-family:inherit;border:1.5px solid rgba(240,207,142,.85);
 background:linear-gradient(115deg,#2a170a 0%,#5e3a16 18%,#c99a52 36%,#7a4a1a 50%,#4a2a12 66%,#8f3f55 82%,#2a170a 100%);
 background-size:320% 100%;
 box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.55),0 0 16px rgba(232,184,106,.25);
 animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards,flow 7s ease-in-out infinite alternate;
 transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#b:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes flow{0%{background-position:100% 0}100%{background-position:0 0}}
#fill{position:absolute;top:0;bottom:0;right:0;width:0;transition:width .6s ease;
 background:linear-gradient(270deg,rgba(255,140,170,.55),rgba(255,200,160,.25))}
#sheen{position:absolute;top:0;bottom:0;width:38%;left:-50%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);
 animation:sweep 4.5s ease-in-out infinite}
.playing #sheen{animation-duration:2.2s}
@keyframes sweep{0%{left:-50%}100%{left:130%}}
#face{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.ic{width:17px;height:17px;fill:#fff0cf;flex:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6));animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-90deg)}to{opacity:1;transform:none}}
.lbl{font-size:18px;line-height:1;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.stop,.l-stop{display:none}
.playing .stop{display:block}
.playing .l-stop{display:inline}
.playing .play,.playing .l-play{display:none}
.playing#b{animation:glow 2.6s ease-in-out infinite,flow 3.5s linear infinite alternate}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.55),0 0 14px rgba(232,184,106,.2)}
 50%{box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.55),0 0 30px rgba(232,184,106,.55)}}
</style></head><body>
<div id="top"><div id="head"><div><div id="title">سورة القيامة</div><div id="sub"></div></div><div id="pg"></div></div></div>
<div id="pages"></div>
<div id="bar"><button id="b" aria-label="play">
 <span id="fill"></span><span id="sheen"></span>
 <span id="face">
  <svg class="ic play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  <svg class="ic stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
  <span class="lbl l-play">ابدأ التلاوة</span><span class="lbl l-stop">إيقاف</span>
 </span></button></div>
<script src="surah.js"></script>
<script>
const pagesEl=document.getElementById('pages'),b=document.getElementById('b'),fill=document.getElementById('fill'),sub=document.getElementById('sub'),pg=document.getElementById('pg');
const ar=n=>Number(n).toLocaleString('ar-EG');
const ws=[],pages=[],pmap={};
const ROSE='<svg viewBox="0 0 100 120" fill="none" stroke="#e3b866" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="62" r="41"/><ellipse cx="50" cy="62" rx="37.500" ry="21"/><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/><path d="M46.500 15.500C41 11 35 14 35 24"/><g transform="translate(100,0) scale(-1,1)"><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/><path d="M46.500 15.500C41 11 35 14 35 24"/></g><g transform="translate(0,124) scale(1,-1)"><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/></g><g transform="translate(0,124) scale(1,-1)"><g transform="translate(100,0) scale(-1,1)"><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/></g></g><path d="M50 3.500C47 6.800 47 10.200 50 13.500C53 10.200 53 6.800 50 3.500Z" fill="#e3b866" stroke="none"/><circle cx="50" cy="19" r="2.200" fill="#e3b866" stroke="none"/><path d="M35 100.500C34 110 42 111 45.500 106C47 112 53 112 54.500 106C58 111 66 110 65 100.500"/></svg>';
function newPage(n){
  const el=document.createElement('div');el.className='page';
  const z=document.createElement('div');z.className='zoom';
  const g=document.createElement('div');g.className='g';
  const inner=document.createElement('div');inner.className='inner';
  z.appendChild(g);z.appendChild(inner);el.appendChild(z);pagesEl.appendChild(el);
  const p={el,z,g,inner,n,k:pages.length,words:[]};
  pages.push(p);return p;
}
function add(p,txt,isNum){
  const s=document.createElement('span');
  if(isNum){s.className='w num';s.innerHTML=ROSE+'<b>'+txt+'</b>'}
  else{s.className='w';s.textContent=txt}
  s._p=p.k;p.inner.appendChild(s);p.words.push(s);ws.push(s);
}
SURAH.verses.forEach(v=>{
  const n=Number(v.verse_key.split(':')[1]);
  const pn=v.page_number||(n<=19?577:578);
  const p=pmap[pn]||(pmap[pn]=newPage(pn));
  v.text_uthmani.split(' ').forEach(t=>add(p,t,false));
  add(p,ar(n),true);
});
sub.textContent='الجزء '+ar(29)+' · '+ar(SURAH.verses.length)+' آية';
let i=-1,t=null,size=20,curPage=0,lastP=-1,lock=0;

function updCount(){pg.textContent=ar(pages[curPage].n)}
function updProg(){fill.style.width=(i<0?0:((i+1)/ws.length)*100)+'%'}
function fit(){
  pagesEl.style.fontSize=size+'px';
  pages.forEach(p=>{
    const avail=p.el.clientHeight-12;
    p.inner.style.marginTop=Math.max(0,(avail-p.inner.offsetHeight)/2)+'px';
  });
}
function autoFit(){
  pages.forEach(p=>p.inner.style.marginTop='0px');
  for(size=26;size>13;size--){
    pagesEl.style.fontSize=size+'px';
    if(pages.every(p=>p.inner.offsetHeight<=p.el.clientHeight-12))break;
  }
  fit();
}
function place(anim,instant){
  const w=ws[i];
  pages.forEach((p,k)=>{if(!w||k!==w._p)p.g.style.opacity=0});
  if(!w)return;
  const g=pages[w._p].g,same=(w._p===lastP);
  g.style.transition=(anim&&same)?'':'none';
  g.style.left=(w.offsetLeft-3)+'px';
  g.style.top=(w.offsetTop-2)+'px';
  g.style.width=(w.offsetWidth+6)+'px';
  g.style.height=(w.offsetHeight+4)+'px';
  if(instant||same){g.style.opacity=1}
  else{requestAnimationFrame(()=>{g.style.transition='opacity .4s ease';g.style.opacity=1})}
  lastP=w._p;
}
function follow(w){
  const p=pages[w._p],el=p.el;
  if(el.scrollHeight>el.clientHeight+2)el.scrollTo({top:w.offsetTop+p.z.offsetTop-el.clientHeight/2,behavior:'smooth'});
}
function showPage(k){
  curPage=k;lock=Date.now()+700;updCount();
  pages[k].el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function stop(){clearInterval(t);t=null;b.classList.remove('playing')}
function go(){
  if(i>=0)ws[i].classList.remove('on');
  i++;
  if(i>=ws.length){stop();i=-1;place(false);updProg();return}
  ws[i].classList.add('on');
  if(ws[i]._p!==curPage&&Date.now()>lock)showPage(ws[i]._p);
  follow(ws[i]);place(true);updProg();
}
b.onclick=()=>{
  if(t){stop();return}
  if(i<0){i=ws.findIndex(w=>w._p===curPage)-1}
  b.classList.add('playing');go();t=setInterval(go,800);
};
let rafS=0;
pagesEl.addEventListener('scroll',()=>{
  cancelAnimationFrame(rafS);
  rafS=requestAnimationFrame(()=>{
    if(Date.now()<lock)return;
    const k=Math.round(Math.abs(pagesEl.scrollLeft)/pagesEl.clientWidth);
    if(k!==curPage&&k<pages.length){curPage=k;updCount()}
  });
});

/* ---- التكبير المقيد في المنتصف بدون حركة يمين ويسار ---- */
let pinch=null,flipT=0,flipPage=null;
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
const mid=e=>({x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2});

function cleanFlip(){
  clearTimeout(flipT);
  if(!flipPage)return;
  flipPage.words.forEach(w=>{w.style.transition='';w.style.transform='';w.style.transformOrigin=''});
  flipPage.g.style.transform='';flipPage.g.style.transformOrigin='';
  flipPage=null;
}

function commit(p,s){
  const ns=Math.max(12,Math.min(60,size*s));
  const olds=p.words.map(w=>w.getBoundingClientRect());
  const og=p.g.getBoundingClientRect();
  const gVisible=p.g.style.opacity==='1';
  p.z.style.transition='none';p.z.style.transform='';
  size=ns;fit();place(false,true);
  const news=p.words.map(w=>w.getBoundingClientRect());
  const ng=p.g.getBoundingClientRect();
  p.words.forEach((w,j)=>{
    const o=olds[j],n=news[j];
    if(!n.width)return;
    w.style.transition='none';w.style.transformOrigin='0 0';
    w.style.transform='translate('+(o.left-n.left)+'px,'+(o.top-n.top)+'px) scale('+(o.width/n.width)+')';
  });
  if(gVisible&&ng.width){
    p.g.style.transition='none';p.g.style.transformOrigin='0 0';
    p.g.style.transform='translate('+(og.left-ng.left)+'px,'+(og.top-ng.top)+'px) scale('+(og.width/ng.width)+','+(og.height/ng.height)+')';
  }
  void p.el.offsetWidth;
  const T='transform .55s cubic-bezier(.2,.8,.2,1)';
  p.words.forEach(w=>{w.style.transition=T+',opacity .3s,color .3s';w.style.transform=''});
  if(gVisible){p.g.style.transition=T;p.g.style.transform=''}
  flipPage=p;
  flipT=setTimeout(cleanFlip,650);
}

document.addEventListener('touchstart',e=>{
  if(e.touches.length>=2){
    if(e.cancelable)e.preventDefault();
    if(pinch)return;
    cleanFlip();
    const p=pages[curPage],c=mid(e);
    pinch={p,d0:dist(e)||1,c0:c,s:1};
    p.z.style.transition='none';
    p.z.style.transformOrigin='50% 50%';
  }
},{passive:false});

document.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length>=2){
    if(e.cancelable)e.preventDefault();
    const c=mid(e);
    pinch.s=Math.max(12/size,Math.min(60/size,dist(e)/pinch.d0));
    // قفل الحركة الأفقية تماماً (X = 0) والسماح بالحركة العمودية فقط مع التكبير
    pinch.p.z.style.transform='translate(0px, '+(c.y-pinch.c0.y)+'px) scale('+pinch.s+')';
  }
},{passive:false});

function endPinch(e){
  if(pinch&&e.touches.length<2){
    const {p,s}=pinch;pinch=null;
    commit(p,s);
  }
}
document.addEventListener('touchend',endPinch);
document.addEventListener('touchcancel',endPinch);

window.addEventListener('resize',()=>{fit();place(false,true)});
autoFit();
curPage=0;pages[0].el.scrollIntoView({inline:'center',block:'nearest'});
updCount();updProg();
</script></body></html>
