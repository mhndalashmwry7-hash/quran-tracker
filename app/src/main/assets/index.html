<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{-webkit-tap-highlight-color:transparent}
:root{--t1:#ff9a1f;--t2:#ff6b95;--t3:#ff3030;--t4:#ff4545;--t5:#9fe9ff;--t6:#1fa35c;--tf:#4a6cf0;--sm:#fff2a0}
html,body{height:100%;margin:0;background:#0b0705;color:#e8b86a;font-family:serif;overflow:hidden}
body{display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#1d130b 0%,#0b0705 62%);--bar:70px}
#top{flex:none;padding:calc(5px + var(--st,0px)) 12px 0;position:relative}
#mini{display:flex;opacity:0;pointer-events:none;position:absolute;left:16px;right:16px;top:calc(var(--st,0px) + 17px);align-items:center;justify-content:space-between;font-size:13px;color:rgba(246,220,160,.85);transition:opacity .35s ease}
#mini span{flex:1;white-space:nowrap}
#mSu{text-align:start;font-family:'uhafs',serif}
#mPg{text-align:center;font-size:14px;color:#f6dca0}
#mHz{text-align:end}
.nohead #mini{opacity:1;transition:opacity .6s ease .2s}
#hrow{display:flex;align-items:center;gap:8px;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .45s ease}
.nohead #hrow{transform:translateY(calc(-100% - var(--st,0px) - 20px));opacity:0;pointer-events:none}
.hbtn{flex:none;width:40px;align-self:stretch;display:grid;place-items:center;padding:0;margin:0;border-radius:15px;outline:none;cursor:pointer;color:#f0cf8e;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(240,207,142,.35);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .2s ease}
.hbtn:active{transform:scale(.94)}
#head{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;padding:5px 12px;border-radius:18px;cursor:pointer;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
 border:1px solid rgba(240,207,142,.35);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.45);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#title{font-family:'uhafs',serif;font-size:20px;color:#f6dca0;text-shadow:0 2px 12px rgba(232,184,106,.25);line-height:1.3;white-space:nowrap}
#sub{font-size:10px;color:rgba(232,184,106,.7);line-height:1.25;margin-top:1px;white-space:nowrap}
.sp{display:inline-block;width:1px;height:.95em;background:currentColor;opacity:.55;margin:0 .55em;vertical-align:-.12em}
#menuBtn{flex:none;width:36px;height:29px;display:grid;place-items:center;padding:0;margin:0;border-radius:11px;outline:none;cursor:pointer;
 background:rgba(240,207,142,.1);border:1px solid rgba(240,207,142,.25);color:#f0cf8e;transition:transform .2s ease}
#menuBtn:active{transform:scale(.94)}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x pan-y;scrollbar-width:none;font-size:17px}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;position:relative;box-sizing:border-box;padding:0 8px calc(3px + var(--bar,70px)) 12px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;isolation:isolate}
.page::-webkit-scrollbar{display:none}
.zoom{position:relative;display:flow-root;transform-origin:0 0}
.inner{word-spacing:-.16em;text-align:justify;text-align-last:center;line-height:2.1}
.inner.mush{word-spacing:0}
.ln{display:flex;align-items:center;justify-content:space-between;white-space:nowrap;line-height:1.5}
.ln.c{justify-content:center;gap:.28em}
.ln>*{flex:none}
.ln .w,.ln .num{margin-top:0;margin-bottom:0}
.ln .ban{margin:0;width:100%;box-sizing:border-box;font-size:inherit}
.ln .bsm{margin:0;width:100%;font-size:inherit;line-height:1.3;position:relative;top:-.12em}
.w{display:inline-block;position:relative;z-index:1;padding:0 1px;margin:calc(-.2em + var(--gap,0px)) 0;opacity:.95;color:#f2d28f;transform:scale(1);
 transition:opacity .4s ease, color .4s ease, transform 0.75s cubic-bezier(0.25, 1, 0.5, 1);
 transform-origin:center center}
.w.on{opacity:1;color:#ffffff;transform:scale(1.15);text-shadow:0 0 12px rgba(255,240,207,0.6)}
.blind .w.fut{opacity:0!important;text-shadow:none}
/* ألوان التجويد */
.w i{font-style:normal}
.tj .w i.t1{color:var(--t1)}.tj .w i.t2{color:var(--t2)}.tj .w i.t3{color:var(--t3)}.tj .w i.t4{color:var(--t4)}
.tj .w i.t5{color:var(--t5)}.tj .w i.t6{color:var(--t6)}.tj .w i.tf{color:var(--tf)}.tj .w i.sm{color:var(--sm)}
.tj .w.on i{filter:brightness(1.2)}
.num{width:1.2em;padding:0;margin:calc(-.2em + var(--gap,0px)) 1px;opacity:.85}
.num svg{position:absolute;inset:0;width:100%;height:100%}
.num b{position:absolute;inset:0;display:grid;place-items:center;font-size:.45em;font-weight:normal;color:#f6dca0;line-height:1;padding-top:.1em}
.num.on b{color:#fff}
/* ===== برواز السورة ===== */
.ban{position:relative;display:flex;align-items:center;justify-content:space-between;gap:.45em;min-width:0;margin:.6em 0 .1em;padding:.28em .5em;border-radius:.7em;text-align:start;font-size:min(1em,4.4vw);
 background:radial-gradient(120% 140% at 50% 0%,#3a2812,#150d06 70%);
 border:1.5px solid #d9ab5c;
 box-shadow:inset 0 0 0 2px #100904,inset 0 0 0 3px rgba(240,207,142,.7),inset 0 0 0 6px #100904,inset 0 0 0 7px rgba(240,207,142,.35),0 5px 16px rgba(0,0,0,.5)}
.ban .bn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:.5em;padding:.04em .6em;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 55%,rgba(0,0,0,.18));
 border:1.5px solid rgba(240,207,142,.7);
 box-shadow:inset 0 0 0 2px rgba(10,6,2,.9),inset 0 0 0 3px rgba(240,207,142,.35),0 0 12px rgba(232,184,106,.18);
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ban .bt{font-family:'uhafs',serif;font-size:1.7em;line-height:1.7;color:#f6dca0;text-shadow:0 1px 6px rgba(0,0,0,.5);white-space:nowrap}
.ban .dm{flex:none;width:.42em;height:.42em;transform:rotate(45deg);background:linear-gradient(135deg,#f6dca0,#b98a3e);box-shadow:0 0 0 1.5px rgba(10,6,2,.9),0 0 0 2.5px rgba(240,207,142,.6)}
.ban .bd{flex:none;width:2.6em;height:2.6em;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
 background:radial-gradient(circle at 35% 30%,#4a3315,#160e06 75%);
 box-shadow:0 0 0 2px #100904,0 0 0 3px rgba(240,207,142,.75),0 0 0 5px #100904,0 0 0 6px rgba(240,207,142,.3)}
.ban .bd small{font-size:.45em;color:#e8b86a}
.ban .bd b{font-size:.75em;font-weight:normal;color:#f6dca0}
.bsm{text-align:center;font-size:min(2.3em,9vw);line-height:1.7;color:#f6dca0;margin:.15em 0 .3em}
.bsm .q{-webkit-text-stroke:.018em currentColor}
.bsm .r{color:#ff6a5c}
.g{position:absolute;z-index:0;border-radius:999px;pointer-events:none;opacity:0;
 background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.08));
 border:1.5px solid rgba(255,255,255,.55);
 box-shadow:inset 0 1px 2px rgba(255,255,255,.6),0 8px 24px rgba(0,0,0,.55),0 0 18px rgba(232,184,106,.35);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 transition:left 0.75s cubic-bezier(0.25, 1, 0.5, 1), top 0.75s cubic-bezier(0.25, 1, 0.5, 1), width 0.75s cubic-bezier(0.25, 1, 0.5, 1), height 0.75s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
}
.busy .g,.busy .ban .bn{-webkit-backdrop-filter:none;backdrop-filter:none}
/* ===== زر ابدأ التلاوة ===== */
#bar{position:fixed;left:0;right:0;bottom:14px;z-index:20;display:flex;justify-content:center;pointer-events:none}
#b{z-index:2;pointer-events:auto;position:relative;left:calc(-1*min(2.45vw,9.5px));width:min(39vw,152px);height:50px;border-radius:25px;padding:0;margin:0;outline:none;overflow:hidden;cursor:pointer;
 color:#fff0cf;font-family:inherit;border:1.5px solid rgba(240,207,142,.85);
 background:linear-gradient(115deg,#2a170a 0%,#5e3a16 18%,#c99a52 36%,#7a4a1a 50%,#4a2a12 66%,#8f3f55 82%,#2a170a 100%);
 background-size:320% 100%;
 box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.55),0 0 16px rgba(232,184,106,.25);
 animation:flow 7s ease-in-out infinite alternate;
 transition:transform .85s cubic-bezier(.22,1,.36,1)}
#b.intro{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards,flow 7s ease-in-out infinite alternate}
#b:active{transform:scale(.95);transition:transform .12s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes flow{0%{background-position:100% 0}100%{background-position:0 0}}
#fill{position:absolute;top:0;bottom:0;right:0;width:0;overflow:hidden;transition:width .6s ease;
 background:linear-gradient(270deg,rgba(255,170,190,.6),rgba(255,214,170,.3))}
#fill::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:rgba(255,240,207,.8)}
#sheen{position:absolute;top:0;bottom:0;width:38%;left:-50%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);
 animation:sweep 4.5s ease-in-out infinite}
.playing #sheen{animation-duration:2.2s}
@keyframes sweep{0%{left:-50%}100%{left:130%}}
#face{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;gap:2px}
.ic{width:17px;height:17px;fill:#fff0cf;flex:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6));animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-90deg)}to{opacity:1;transform:none}}
.lbl{font-size:18px;line-height:1;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.stop,.l-stop{display:none}
.playing .stop{display:block}
.playing .l-stop{display:inline}
.playing .play,.playing .l-play{display:none}
.playing#b{animation:glow 2.6s ease-in-out infinite,flow 3.5s linear infinite alternate}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.55),0 0 14px rgba(232,184,106,.2)}
 50%{box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.55),0 0 30px rgba(232,184,106,.55)}}
/* ===== الفقاعتان (الغيب + السرعة) ===== */
.bub{position:absolute;bottom:3px;left:50%;margin-left:-22px;width:44px;height:44px;z-index:1;opacity:0;pointer-events:none;
 transform:translateX(0) scale(.25);transition:transform .5s cubic-bezier(.5,0,.75,.4),opacity .3s ease .1s}
.tracking .bub{opacity:1;pointer-events:auto;transition:transform .72s cubic-bezier(.34,1.55,.5,1),opacity .35s ease}
.tracking .bub.l{transform:translateX(-128px) scale(1)}
.tracking .bub.r{transform:translateX(108px) scale(1)}
.bb{width:100%;height:100%;border-radius:50%;padding:0;margin:0;outline:none;cursor:pointer;display:grid;place-items:center;color:#f6dca0;
 background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1.5px solid rgba(240,207,142,.7);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.5),0 0 12px rgba(232,184,106,.2);
 transition:background .3s ease,color .3s ease,transform .2s ease}
.bb:active{transform:scale(.92)}
.bb.act{background:linear-gradient(145deg,#f6dca0,#b98a3e);color:#2a1b0a}
.spop{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(8px) scale(.92);transform-origin:50% 100%;opacity:0;pointer-events:none;white-space:nowrap;padding:6px;border-radius:16px;
 background:linear-gradient(165deg,rgba(70,50,26,.84),rgba(26,17,9,.9));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 border:1px solid rgba(240,207,142,.4);box-shadow:0 10px 28px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s ease}
.spop.open{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.sopt{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:12px;background:none;border:0;color:#e8cf9a;font-family:inherit;font-size:15px;text-align:start;outline:none;cursor:pointer}
.sopt.sel{background:rgba(240,207,142,.16);color:#fff0cf}
.ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(240,207,142,.5);box-sizing:border-box}
.sel .ck{background:linear-gradient(145deg,#f6dca0,#b98a3e);border-color:transparent}
/* ===== القائمة الجانبية الزجاجية ===== */
#scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .8s ease}
#menu{position:fixed;top:0;bottom:0;left:0;z-index:60;width:min(74vw,290px);box-sizing:border-box;padding:calc(14px + var(--st,0px)) 0 16px;
 transform:translateX(-104%);transition:transform .85s cubic-bezier(.22,1,.36,1);
 background:linear-gradient(165deg,rgba(70,50,26,.72),rgba(26,17,9,.8));
 -webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);
 border-right:1px solid rgba(240,207,142,.4);box-shadow:8px 0 40px rgba(0,0,0,.4),inset -1px 0 1px rgba(255,255,255,.2)}
.menuopen #scrim{opacity:1;pointer-events:auto}
.menuopen #menu{transform:none}
.mi{display:flex;align-items:center;gap:12px;width:calc(100% - 28px);margin:6px 14px 0;box-sizing:border-box;padding:10px 12px;border-radius:16px;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(240,207,142,.32);
 color:#f6dca0;font-family:inherit;font-size:17px;text-align:start;outline:none;cursor:pointer;box-shadow:inset 0 1px 1px rgba(255,255,255,.2)}
.mi .mic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#f6dca0,#b98a3e);color:#2a1b0a}
.mic .i-sun{display:none}
body.light .mic .i-sun{display:block}
body.light .mic .i-moon{display:none}
.mi .mt{flex:1}
.mi .chev{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(240,207,142,.12);border:1px solid rgba(240,207,142,.38);transition:transform .55s cubic-bezier(.22,1,.36,1),background .3s ease}
.mi.open .chev{transform:rotate(180deg);background:rgba(240,207,142,.26)}
.sub{max-height:0;overflow:hidden;transition:max-height .6s ease}
.sub.open{max-height:180px}
.opt{display:flex;align-items:center;gap:12px;width:calc(100% - 44px);margin:8px 22px 0;box-sizing:border-box;padding:9px 12px;border-radius:14px;
 background:rgba(255,255,255,.06);border:1px solid rgba(240,207,142,.22);color:#e8cf9a;font-family:inherit;font-size:16px;text-align:start;outline:none;cursor:pointer;transition:background .3s ease,border-color .3s ease}
.opt .oic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(240,207,142,.16)}
.opt .ot{flex:1}
.opt.sel{background:rgba(240,207,142,.18);border-color:rgba(240,207,142,.7);color:#fff0cf}
/* مفتاح ألوان التجويد */
.sw{flex:none;position:relative;width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(240,207,142,.4);transition:background .35s ease,border-color .35s ease}
.sw i{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#e8cf9a;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .38s cubic-bezier(.22,1,.36,1),background .3s ease}
.sw.on{background:linear-gradient(145deg,#f6dca0,#b98a3e);border-color:transparent}
.sw.on i{transform:translateX(-20px);background:#2a1b0a}
/* ===== صفحة الإعدادات (فاضية الحين) ===== */
#setpage{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;visibility:hidden;transform:translateX(-100%);box-sizing:border-box;padding:calc(10px + var(--st,0px)) 14px 14px;
 background:radial-gradient(120% 70% at 50% 0%,#1d130b 0%,#0b0705 62%);transition:transform .55s cubic-bezier(.22,1,.36,1),visibility 0s linear .55s}
.setpage-open #setpage{visibility:visible;transform:none;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.sph{display:flex;align-items:center;gap:12px;padding:6px 2px 14px;border-bottom:1px solid rgba(240,207,142,.25)}
.spb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;margin:0;outline:none;cursor:pointer;color:#f6dca0;background:rgba(240,207,142,.12);border:1px solid rgba(240,207,142,.38)}
.spt{font-size:21px;color:#f6dca0}
/* ===== قائمة السور (تتكبر من الشريط العلوي) ===== */
#slist{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;visibility:hidden;clip-path:inset(0 round 0);box-sizing:border-box;padding:calc(10px + var(--st,0px)) 12px 12px;display:flex;flex-direction:column;
 background:linear-gradient(165deg,rgba(40,28,14,.9),rgba(12,8,4,.95));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.slh{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 4px 12px;border-bottom:1px solid rgba(240,207,142,.25)}
.slt{font-size:21px;color:#f6dca0}
.slx{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;margin:0;outline:none;cursor:pointer;color:#f6dca0;background:rgba(240,207,142,.12);border:1px solid rgba(240,207,142,.38)}
.slb{flex:1;min-height:0;overflow-y:auto;padding-top:8px;opacity:0;transition:opacity .3s ease;scrollbar-width:none}
.slb::-webkit-scrollbar{display:none}
.slopen .slb{opacity:1;transition:opacity .5s ease .45s}
.sli{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;margin:0 0 8px;padding:10px 12px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(240,207,142,.25);color:#f6dca0;font-family:inherit;text-align:start;outline:none;cursor:pointer}
.sli:active{background:rgba(240,207,142,.18)}
.sli .sn{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#2a1b0a;background:linear-gradient(145deg,#f6dca0,#b98a3e)}
.sli .sm2{flex:1;font-family:'uhafs',serif;font-size:22px;line-height:1.5}
.sli .sc{flex:none;font-size:12px;color:rgba(232,184,106,.75)}
/* ===== المظهر الفاتح ===== */
body.light{--t1:#e07800;--t2:#e0457a;--t3:#d40000;--t4:#e01d1d;--t5:#0aa5d6;--t6:#0b7a37;--tf:#1b3fbf;--sm:#d6b800;background:#fff;color:#111}
body.light #head{background:linear-gradient(145deg,rgba(0,0,0,.07),rgba(0,0,0,.02));border-color:rgba(0,0,0,.28);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 6px 18px rgba(0,0,0,.12)}
body.light .hbtn{color:#111;background:linear-gradient(145deg,rgba(0,0,0,.07),rgba(0,0,0,.02));border-color:rgba(0,0,0,.28);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 6px 18px rgba(0,0,0,.12)}
body.light #title{color:#111;text-shadow:none}
body.light #sub{color:rgba(0,0,0,.55)}
body.light #mini{color:rgba(0,0,0,.7)}
body.light #mPg{color:#111}
body.light #menuBtn{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.3);color:#111}
body.light .w{color:#111}
body.light .w.on{color:#000;text-shadow:0 0 10px rgba(0,0,0,.25)}
body.light .num b{color:#111}

<script>
const pagesEl=document.getElementById('pages'),b=document.getElementById('b'),fill=document.getElementById('fill'),sub=document.getElementById('sub'),pg=document.getElementById('pg'),titleEl=document.getElementById('title');

const ar=n=>Number(n).toLocaleString('ar-EG');
const ws=[],pages=[],pmap={},fs=[],cinfo={},jp={};
const MAXS=1.6;
let GN=1;

const NAMES={78:'النَّبَإِ',79:'النَّازِعَاتِ',80:'عَبَسَ',81:'التَّكْوِيرِ',82:'الِانفِطَارِ',83:'المُطَفِّفِينَ',84:'الِانشِقَاقِ',85:'البُرُوجِ',86:'الطَّارِقِ',87:'الأَعْلَى',88:'الغَاشِيَةِ',89:'الفَجْرِ',90:'البَلَدِ',91:'الشَّمْسِ',92:'اللَّيْلِ',93:'الضُّحَى',94:'الشَّرْحِ',95:'التِّينِ',96:'العَلَقِ',97:'القَدْرِ',98:'البَيِّنَةِ',99:'الزَّلْزَلَةِ',100:'العَادِيَاتِ',101:'القَارِعَةِ',102:'التَّكَاثُرِ',103:'العَصْرِ',104:'الهُمَزَةِ',105:'الفِيلِ',106:'قُرَيْشٍ',107:'المَاعُونِ',108:'الكَوْثَرِ',109:'الكَافِرُونَ',110:'النَّصْرِ',111:'المَسَدِ',112:'الإِخْلَاصِ',113:'الفَلَقِ',114:'النَّاسِ'};
const SUR='سُورَةُ ';

const ROSE='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none" stroke="#e3b866" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="62" r="41"/><ellipse cx="50" cy="62" rx="37.500" ry="21"/><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/><path d="M46.500 15.500C41 11 35 14 35 24"/><g transform="translate(100,0) scale(-1,1)"><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/><path d="M46.500 15.500C41 11 35 14 35 24"/></g><g transform="translate(0,124) scale(1,-1)"><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/></g><g transform="translate(0,124) scale(1,-1)"><g transform="translate(100,0) scale(-1,1)"><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/></g></g><path d="M50 3.500C47 6.800 47 10.200 50 13.500C53 10.200 53 6.800 50 3.500Z" fill="#e3b866" stroke="none"/><circle cx="50" cy="19" r="2.200" fill="#e3b866" stroke="none"/><path d="M35 100.500C34 110 42 111 45.500 106C47 112 53 112 54.500 106C58 111 66 110 65 100.500"/></svg>';

roseStyle.textContent='.num{background:url("data:image/svg+xml,'+encodeURIComponent(ROSE)+'") center/auto 1.4em no-repeat}body.light .num{background-image:url("data:image/svg+xml,'+encodeURIComponent(ROSE_L)+'")}';
document.head.appendChild(roseStyle);

/* خط المصحف المدني (QCF V1) + خط أسماء السور من خوادم Quran Foundation */
const QBASE='https://verses.quran.foundation/fonts/quran/hafs/v1/woff2/p';
const UFONT='https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2';
const qready={};
function loadQ(pn){
  return new FontFace('qv1-'+pn,'url('+QBASE+pn+'.woff2)').load()
    .then(f=>{document.fonts.add(f);qready[pn]=true})
    .catch(()=>{qready[pn]=false});
}
function loadU(){
  return new FontFace('uhafs','url('+UFONT+')').load().then(f=>{document.fonts.add(f)}).catch(()=>{});
}
function loadAll(){
  if(typeof FontFace==='undefined')return Promise.resolve();
  const need=new Set();
  SURAH.verses.forEach(v=>(v.words||[]).forEach(w=>need.add(w.p)));
  if(typeof BASMALA_W!=='undefined')BASMALA_W.forEach(w=>need.add(w.p));
  const jobs=[...need].map(loadQ);jobs.push(loadU());
  return Promise.race([Promise.all(jobs),new Promise(r=>setTimeout(r,7000))]);
}

/* ===== ألوان التجويد ===== */
const TJ_CLS={madda_normal:'t1',madda_permissible:'t2',madda_necessary:'t3',madda_obligatory:'t4',qalqalah:'t5',ghunnah:'t6',ikhafa:'t6',ikhafa_shafawi:'t6',idgham_ghunnah:'t6',idgham_shafawi:'t6',iqlab:'t6'};
const TAF='خصضغطقظ';
const isSmall=c=>c==='\u0670'||c==='\u06E5'||c==='\u06E6';
const isMark=c=>/[\u064B-\u065F\u06D6-\u06ED]/.test(c);
let tajOn=false;try{tajOn=localStorage.getItem('qtaj')==='1'}catch(e){}
function tjParse(html){
  if(!html)return null;
  html=html.replace(/<span[^>]*class=["']?end["']?[^>]*>[\s\S]*?<\/span>/g,'');
  const words=[[]];let cls=null;
  const re=/<\/?[a-zA-Z][^>]*>|[^<]+/g;let m;
  while((m=re.exec(html))){
    const tok=m[0];
    if(tok.charAt(0)==='<'){
      if(tok.charAt(1)==='/'){cls=null}
      else{const c=/class=["']?([a-z_]+)/.exec(tok);cls=c?c[1]:null}
      continue;
    }
    for(const ch of tok){
      if(ch===' '||ch==='\u00A0'){if(words[words.length-1].length)words.push([]);continue}
      const cur=words[words.length-1];
      const last=cur[cur.length-1];
      if(last&&last[1]===cls)last[0]+=ch;else cur.push([ch,cls]);
    }
  }
  if(!words[words.length-1].length)words.pop();
  return words;
}
function tfSplit(txt){
  txt=txt.replace(/\u06ED/g,'');
  let out='',open=false;
  const close=()=>{if(open){out+='</i>';open=false}};
  for(const ch of txt){
    if(isSmall(ch)){out+=ch;continue}
    if(isMark(ch)){out+=ch;continue}
    close();
    if(TAF.indexOf(ch)>=0){out+='<i class="tf">'+ch;open=true}else out+=ch;
  }
  close();return out;
}
function tjHTML(segs){
  let out='';
  segs.forEach(sg=>{
    const k=TJ_CLS[sg[1]];
    if(k)out+='<i class="'+k+'">'+sg[0]+'</i>';
    else out+=tfSplit(sg[0]);
  });
  return out;
}
const DA='<i class="da">\u0627</i>';
function fixDA(h){return h.replace(/([\u0627\u062F\u0630\u0631\u0632\u0648](?:[\u064B-\u0652]|<\/?i[^>]*>)*)\u0670/g,'$1'+DA)}
function renderWord(s){
  s.style.fontFamily="'uhafs',serif";
  s.innerHTML=fixDA(s._seg?tjHTML(s._seg):tfSplit(s._t));
}

function newPage(n){
  const el=document.createElement('div');el.className='page';
  const z=document.createElement('div');z.className='zoom';
  const g=document.createElement('div');g.className='g';
  const inner=document.createElement('div');inner.className='inner';
  z.appendChild(g);z.appendChild(inner);el.appendChild(z);pagesEl.appendChild(el);
  const p={el,z,g,inner,n,k:pages.length,words:[],items:[],seq:[],mode:'flow',canMush:true,rows:null,stale:true};
  pages.push(p);return p;
}
function pageOf(pn){return pmap[pn]||(pmap[pn]=newPage(pn))}
function add(p,txt,isNum,w,row,c,seg){
  const s=document.createElement('span');
  if(isNum){
    s.className='w num';s.innerHTML='&#8203;<b>'+txt+'</b>';
    const pr=p.seq[p.seq.length-1];if(pr)pr.sp=false;
  }else{
    s.className='w';s._w=w||null;s._t=txt;s._seg=seg||null;
    renderWord(s);
  }
  s._p=p.k;s._c=c;
  if(row==null)p.canMush=false;
  p.seq.push({el:s,row:row,sp:!isNum});
  p.words.push(s);p.items.push(s);ws.push(s);
}
function banner(p,c,L0){
  const d=document.createElement('div');d.className='ban';
  d.innerHTML='<div class="bd"><small>ترتيبها</small><b>'+ar(c)+'</b></div><div class="bn"><i class="dm"></i><span class="bt">'+SUR+NAMES[c]+'</span><i class="dm"></i></div><div class="bd"><small>آياتها</small><b>'+ar(cnt[c])+'</b></div>';
  const m=document.createElement('div');m.className='bsm';
  if(typeof BASMALA_W!=='undefined'&&BASMALA_W.length&&false){
    BASMALA_W.forEach((w,k)=>{
      const s=document.createElement('span');
      s.className=k===1?'q r':'q';s.style.fontFamily="'qv1-"+w.p+"'";s.innerHTML=w.c;m.appendChild(s);
      if(k<BASMALA_W.length-1)m.appendChild(document.createTextNode(' '));
    });
  }else m.textContent=BSM;
  let pb=p,pm=p,rb=null,rm=null;
  if(L0==null){p.canMush=false}
  else if(L0>=3){rb=L0-2;rm=L0-1}
  else if(L0===2){rm=1;pb=pmap[p.n-1]||null;rb=15}
  else{pb=pmap[p.n-1]||null;pm=pb;rb=14;rm=15}
  if(pb){pb.seq.push({el:d,row:rb,sp:false});pb.items.push(d)}
  if(pm){pm.seq.push({el:m,row:rm,sp:false});pm.items.push(m)}
  jp[c]={p:(pm||pb||p),el:(pb===pm?d:m)};
}
function build(){
  SURAH.verses.forEach(v=>{
    const a=v.verse_key.split(':').map(Number),c=a[0],n=a[1];
    const wl=(v.words&&v.words.length)?v.words:null;
    const segs=tjParse(v.tj);
    const okT=!!(segs&&wl&&segs.length===wl.length);
    const first=wl?wl[0].p:(v.page_number||591);
    const last=wl?wl[wl.length-1].p:first;
    if(n===1)banner(pageOf(first),c,wl?wl[0].l:null);
    if(wl)wl.forEach((w,j)=>add(pageOf(w.p),w.t,false,w,w.l,c,okT?segs[j]:null));
    else v.text_uthmani.split(' ').forEach(t=>add(pageOf(first),t,false,null,null,c,null));
    add(pageOf(last),ar(n),true,null,wl?wl[wl.length-1].l:null,c);
  });
}
function mkInfo(){
  ws.forEach((w,k)=>{
    const o=cinfo[w._c]||(cinfo[w._c]={a:k,n:0});
    if(!w.classList.contains('num')){o.n++;w._ci=o.n}else w._ci=o.n;
  });
}
let i=-1,gEnd=-1,t=null,mul=1,curPage=0,lastP=-1,lock=0,ready=false,progCh=-1,lastPE=0,lastZoom=1;
let blind=false,seenIdx=-1,hadr=false,resume=false;

/* امتداد الشاشة تحت شريط الإشعارات */
function applyInset(){
  let v=0;try{v=Number(Android.topInset())||0}catch(e){}
  v=Math.round(v*10)/10;
  document.documentElement.style.setProperty('--st',v+'px');

applyInset();
setTimeout(applyInset,350);
setTimeout(applyInset,1200);

function chOfPage(p){const a=[];p.words.forEach(w=>{if(a.indexOf(w._c)<0)a.push(w._c)});return a}
function updHead(){
  const p=pages[curPage];if(!p||!p.words.length)return;
  const c=p.words[0]._c;
  const hs=[];chOfPage(p).forEach(x=>{const h=x>=87?60:59;if(hs.indexOf(h)<0)hs.push(h)});
  hs.sort((a,b)=>a-b);
  const hz=hs.map(ar).join(' - ');

  const sp='<i class="sp"></i>';
  sub.innerHTML='الصفحة '+ar(p.n)+sp+'الجزء '+ar(30)+sp+'الحزب '+hz;
  mSu.textContent=SUR+NAMES[c];mPg.textContent=ar(p.n);mHz.textContent='الحزب '+hz;
}
function updMini(){updHead()}
function updCount(){updHead()}
function resetFill(){fill.style.transition='none';fill.style.width='0%';void fill.offsetWidth;fill.style.transition=''}
function updProg(){
  if(i<0){resetFill();progCh=-1;return}
  const w=ws[Math.max(gEnd,i)],o=cinfo[w._c];
  if(progCh!==w._c){resetFill();progCh=w._c}
  fill.style.width=(w._ci/o.n*100)+'%';
}
function land(){return window.innerWidth>window.innerHeight*1.1}
function mm(k){return Math.max(1.6,50/fs[k])}

/* ===== وضع أسطر المصحف (١٥ سطراً ثابتة) ===== */
function toMush(p){
  p.inner.textContent='';p.inner.classList.add('mush');
  p.rows=[];
  for(let r=1;r<=15;r++){const d=document.createElement('div');d.className='ln';p.inner.appendChild(d);p.rows[r]=d}
  p.seq.forEach(it=>{
    it.el.style.scale='';it.el.style.marginLeft='';it.el.style.marginRight='';it.el._sx=1;
    if(it.row!=null&&p.rows[it.row])p.rows[it.row].appendChild(it.el);
  });
  p.mode='mush';
}
function toFlow(p){
  p.inner.classList.remove('mush');p.inner.textContent='';p.inner.style.height='';
  const fr=document.createDocumentFragment();
  p.seq.forEach(it=>{
    it.el.style.scale='';it.el.style.marginLeft='';it.el.style.marginRight='';it.el._sx=1;
    fr.appendChild(it.el);
    if(it.sp)fr.appendChild(document.createTextNode(' '));
  });
  p.inner.appendChild(fr);
  p.rows=null;p.mode='flow';
}
function natW(d){
  let s=0;const k=d.children;
  for(let j=0;j<k.length;j++){const c=k[j];s+=c.getBoundingClientRect().width+(c.classList.contains('num')?2:0)}
  return s;
}
function clearRow(d){[...d.children].forEach(c=>{c.style.scale='';c.style.marginLeft='';c.style.marginRight='';c._sx=1})}
function layoutMush(p){
  const el=p.el,Hv=AV(el),L=land();
  let rh=Hv/15;
  p.z.style.paddingTop='0px';
  p.inner.style.marginTop='0px';
  const wrows=[];
  p.rows.forEach(d=>{
    if(!d)return;
    clearRow(d);d.classList.remove('c');
    if(d.querySelector('.ban')||d.querySelector('.bsm'))return;
    d.style.fontSize='';
    if(d.children.length)wrows.push(d);
  });
  const C=p.inner.clientWidth;
  let f=40;
  for(let pass=0;pass<2;pass++){
    el.style.fontSize=f+'px';
    let mx=0;wrows.forEach(d=>{mx=Math.max(mx,natW(d))});
    if(!mx)break;
    f=Math.max(9,Math.min(L?90:rh*1.05,f*C/mx*0.99));
  }
  if(L)rh=Math.max(rh,f*1.6);
  p.inner.style.height=(rh*15)+'px';
  p.rows.forEach(d=>{
    if(!d)return;

  });
  el.style.fontSize=f+'px';

  const plans=[];

    let sw=0;const lst=[];

/* ===== وضع التكبير (الكلمات تنزل للأسطر) ===== */
function clearStretch(p){
  p.words.forEach(w=>{w.style.scale='';w.style.marginLeft='';w.style.marginRight='';w._sx=1});
  p.inner.style.textAlign='';p.inner.style.textAlignLast='';
}
function stretchPage(p){
  clearStretch(p);
  const C=p.inner.clientWidth;
  if(!C||!p.words.length)return;
  p.inner.style.textAlign='start';p.inner.style.textAlignLast='start';
  const lines=[];let cur=[],top=null;
  p.words.forEach(w=>{
    const tp=w.offsetTop;
    if(top===null||Math.abs(tp-top)>6){if(cur.length)lines.push(cur);cur=[];top=tp}
    cur.push(w);
  });
  if(cur.length)lines.push(cur);
  const plan=[];
  lines.forEach(L=>{
    const r=L.map(w=>w.getBoundingClientRect());
    let l=1e9,rr=-1e9,sw=0;
    r.forEach((q,k)=>{l=Math.min(l,q.left);rr=Math.max(rr,q.right);if(!L[k].classList.contains('num'))sw+=q.width});
    const left=C-(rr-l);
    if(left<=1||left/C>0.28||!sw)return;
    const s=Math.min(1.18,1+left*0.96/sw);
    if(s<1.002)return;
    L.forEach((w,k)=>{if(!w.classList.contains('num'))plan.push([w,s,r[k].width*(s-1)/2])});
  });
  plan.forEach(a=>{a[0].style.scale=a[1]+' 1';a[0].style.marginLeft=a[0].style.marginRight=a[2]+'px';a[0]._sx=a[1]});
  p.inner.style.textAlign='';p.inner.style.textAlignLast='';
}
function lineCount(p,fpx){
  const tp=p.words.map(w=>w.offsetTop).sort((a,b)=>a-b);
  let n=1;
  for(let k=1;k<tp.length;k++)if(tp[k]-tp[k-1]>fpx*0.9)n++;

}
function flowFit(p){
  stretchPage(p);

  p.inner.style.marginTop='0px';
  const h=p.inner.offsetHeight;
  if(h<avail&&p.words.length){
    const fpx=parseFloat(getComputedStyle(p.el).fontSize)||16;
    const g=Math.min((avail-h)/(2*lineCount(p,fpx)),fpx*.45);
    p.z.style.setProperty('--gap',g+'px');
  }
  p.inner.style.marginTop=Math.max(0,(avail-p.inner.offsetHeight)/2)+'px';
}
function applyMode(p){
  const want=(mul<=1&&p.canMush)?'mush':'flow';
  if(p.mode!==want){if(want==='mush')toMush(p);else toFlow(p)}
  if(p.mode==='mush')layoutMush(p);
  else{p.el.style.fontSize=(fs[p.k]*mul)+'px';flowFit(p)}
}

/* ترتيب الصفحة الحالية فوراً، وباقي الصفحات عند الحاجة فقط */
function ensure(p){

/* مؤشر التتبع (كلمة واحدة، أو مجموعة في وضع الحدر) */
function sameLine(a,b){return Math.abs(a.offsetTop-b.offsetTop)<=a.offsetHeight*0.5}
function groupEnd(s){
  if(GN<2)return s;
  const w0=ws[s];let e=s,n=1;
  for(let k=s+1;k<ws.length&&n<GN;k++){
    const w=ws[k];
    if(w._p!==w0._p||w._c!==w0._c||!sameLine(w0,w))break;
    e=k;
    if(!w.classList.contains('num'))n++;
  }
  while(e+1<ws.length&&ws[e+1].classList.contains('num')&&ws[e+1]._p===w0._p&&sameLine(w0,ws[e+1]))e++;
  return e;
}
function prevStart(s){
  let n=s-1;while(n>=0&&ws[n].classList.contains('num'))n--;
  if(n<0)return -1;
  if(GN<2)return n;
  let c=1;const w0=ws[n];
  while(c<GN){
    let m=n-1;while(m>=0&&ws[m].classList.contains('num'))m--;
    if(m<0||ws[m]._p!==w0._p||ws[m]._c!==w0._c||!sameLine(w0,ws[m]))break;
    n=m;c++;
  }
  return n;
}
function place(anim,instant){
  const w=ws[i];
  pages.forEach((p,k)=>{if(!w||k!==w._p)p.g.style.opacity=0});
  if(!w)return;
  const e=Math.max(gEnd,i);
  let L=1e9,R=-1e9;
  for(let k=i;k<=e;k++){
    const x=ws[k];
    if(x._p!==w._p||!sameLine(w,x))continue;
    const sx=x._sx||1,ow=x.offsetWidth*sx,ol=x.offsetLeft-(ow-x.offsetWidth)/2;
    if(ol<L)L=ol;if(ol+ow>R)R=ol+ow;
  }
  const g=pages[w._p].g,same=(w._p===lastP);
  const hh=w.offsetHeight,gh=(hh+6)*0.86;
  g.style.transition=(anim&&same)?'':'none';
  g.style.left=(L-5)+'px';
  g.style.top=(w.offsetTop+(hh-gh)/2)+'px';
  g.style.width=(R-L+10)+'px';
  g.style.height=gh+'px';
  if(instant||same){g.style.opacity=1}
  else{requestAnimationFrame(()=>{g.style.transition='left 0.75s cubic-bezier(0.25, 1, 0.5, 1), top 0.75s cubic-bezier(0.25, 1, 0.5, 1), width 0.75s cubic-bezier(0.25, 1, 0.5, 1), height 0.75s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease';g.style.opacity=1})}
  lastP=w._p;
}
/* التتبع: ما تنزاح الصفحة فوق عند آخرها، وتتوسّط المؤشر لما يحتاج */
function follow(w,inst){
  const p=pages[w._p],el=p.el;

  const r=w.getBoundingClientRect(),er=el.getBoundingClientRect();
  const cy=r.top+r.height/2,target=window.innerHeight/2;
  if(!land()&&cy<=target+4&&cy>=er.top+24&&cy<=er.bottom-BARH)return;
  const maxTop=el.scrollHeight-el.clientHeight;

}

    p.el.scrollTop+=(r.top+r.height/2)-window.innerHeight/2;
  }else if(ai>=0){
    const r=p.items[ai].getBoundingClientRect();p.el.scrollTop+=(r.top+r.height/2)-anchor.y;
  }
  place(false,true);
  const news=p.items.map(w=>w.getBoundingClientRect());
  const ng=p.g.getBoundingClientRect();
  const near=r=>r.bottom>vp.top-60&&r.top<vp.bottom+60&&r.right>vp.left-60&&r.left<vp.right+60;
  const moved=[];
  p.items.forEach((w,j)=>{
    const o=olds[j],n=news[j];
    if(!n.width||!o.width)return;
    if(!(near(o)||near(n)))return;
    w.style.transition='none';w.style.transformOrigin='0 0';
    w.style.transform='translate('+(o.left-n.left)+'px,'+(o.top-n.top)+'px) scale('+(o.width/n.width)+')';
    moved.push(w);
  });
  if(gVisible&&ng.width){
    p.g.style.transition='none';p.g.style.transformOrigin='0 0';
    p.g.style.transform='translate('+(og.left-ng.left)+'px,'+(og.top-ng.top)+'px) scale('+(og.width/ng.width)+','+(og.height/ng.height)+')';
  }
  void p.el.offsetWidth;
  const T='transform '+(dur/1000)+'s cubic-bezier(.22,.8,.25,1)';
  moved.forEach(w=>{w.style.transition=T;w.style.transform=''});
  if(gVisible){p.g.style.transition=T;p.g.style.transform=''}
  flipPage=p;
  flipT=setTimeout(cleanFlip,dur+80);
  pages.forEach(q=>{if(q!==p)q.stale=true});
  setTimeout(warm,dur+700);
}

function singleTap(){document.body.classList.toggle('nohead')}
function doubleTap(x,y){
  const p=pages[curPage];if(!p)return;

  if(i>=0&&ws[i]._p===p.k){const r=ws[i].getBoundingClientRect();a={x:r.left+r.width/2,y:r.top+r.height/2}}
  cleanFlip();
  const target=mul>1.02?1/mul:zLv(p.k)[2];
  commit(p,target,a,720);
}
let tapT=0,lastTapT=0,lastTapX=0,lastTapY=0,tdown=null;
pagesEl.addEventListener('touchstart',e=>{
  if(e.touches.length===1){const q=e.touches[0];tdown={x:q.clientX,y:q.clientY,t:Date.now(),ok:true}}
  else if(tdown)tdown.ok=false;
},{passive:true});
pagesEl.addEventListener('touchmove',e=>{
  if(!tdown)return;
  const q=e.touches[0];
  if(Math.hypot(q.clientX-tdown.x,q.clientY-tdown.y)>12)tdown.ok=false;
},{passive:true});
pagesEl.addEventListener('touchend',e=>{
  if(!tdown)return;
  if(e.touches.length>0){tdown.ok=false;return}
  const d=tdown;tdown=null;
  const now=Date.now();
  if(!d.ok||pinch||!ready||now-lastPE<500||now-d.t>350)return;
  if(now-lastTapT<320&&Math.hypot(d.x-lastTapX,d.y-lastTapY)<50){
    clearTimeout(tapT);lastTapT=0;doubleTap(d.x,d.y);
  }else{
    lastTapT=now;lastTapX=d.x;lastTapY=d.y;
    clearTimeout(tapT);
    tapT=setTimeout(()=>{if(!pinch)singleTap()},330);
  }
},{passive:true});

function applyPinch(){
  raf=0;
  if(!pinch)return;
  pinch.cs+=(pinch.s-pinch.cs)*0.22;
  if(Math.abs(pinch.s-pinch.cs)<0.002)pinch.cs=pinch.s;
  pinch.p.z.style.transform='translate3d('+pinch.dx+'px,'+pinch.dy+'px,0) scale('+pinch.cs+')';
  if(pinch.cs!==pinch.s)raf=requestAnimationFrame(applyPinch);
}
document.addEventListener('touchstart',e=>{
  if(e.touches.length>=2){
    if(e.cancelable)e.preventDefault();
    if(pinch||!ready)return;
    clearTimeout(tapT);lastTapT=0;
    cleanFlip();
    document.body.classList.add('busy');
    const p=pages[curPage],r=p.z.getBoundingClientRect(),c=mid(e);
    pinch={p,d0:dist(e)||1,c0:c,s:1,cs:1,dx:0,dy:0};
    p.z.style.transition='none';
    p.z.style.transformOrigin=(c.x-r.left)+'px '+(c.y-r.top)+'px';
    p.z.style.willChange='transform';
  }
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length>=2){
    if(e.cancelable)e.preventDefault();
    const c=mid(e);
    pinch.s=Math.max(1/mul,Math.min(mm(curPage)/mul,dist(e)/pinch.d0));
    pinch.dx=c.x-pinch.c0.x;pinch.dy=c.y-pinch.c0.y;
    if(!raf)raf=requestAnimationFrame(applyPinch);
  }
},{passive:false});
function endPinch(e){
  if(pinch&&e.touches.length<2){
    cancelAnimationFrame(raf);raf=0;
    const {p,cs,dx,dy,c0}=pinch;pinch=null;lastPE=Date.now();
    p.z.style.transform='translate3d('+dx+'px,'+dy+'px,0) scale('+cs+')';
    commit(p,cs,{x:c0.x+dx,y:c0.y+dy},700);
  }
}
document.addEventListener('touchend',endPinch);
document.addEventListener('touchcancel',endPinch);

/* التتبع بالصوت */
const vnz=x=>x.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640\u200B-\u200F]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
function vw(k){const w=ws[k];return w._vn||(w._vn=vnz(w._t||''))}
function vlev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let x=1;x<=m;x++){const c=[x];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[x-1]===b[j-1]?0:1));p=c}return p[n]}
function vsim(a,b){if(a===b)return true;const L=Math.max(a.length,b.length);return L>=4&&vlev(a,b)<=(L>=7?2:1)}
function vmatch(T){
  if(!T.length)return;
  const st=i>=0?Math.max(0,gEnd-3):ws.findIndex(w=>w._p===curPage&&!w.classList.contains('num'));
  if(st<0)return;
  const cand=[];
  for(let k=st;k<ws.length&&cand.length<45;k++)if(!ws[k].classList.contains('num'))cand.push(k);
  let best=-1,bs=0;
  for(let d=0;d<2;d++){
    const tail=T.slice(0,T.length-d).slice(-5);
    if(!tail.length)continue;
    for(let a=0;a<cand.length;a++){
      let m=0;
      for(let q=1;q<=tail.length&&a-q+1>=0;q++){
        if(vsim(vw(cand[a-q+1]),tail[tail.length-q]))m++;else break;
      }
      if(!m)continue;
      if(m===1&&(tail[tail.length-1].length<4||a>12))continue;
      const sc=m-d*0.5-a*0.005;
      if(sc>bs){bs=sc;best=cand[a]}
    }
  }
  if(best>=0&&(i<0||best>=i))setCursor(best);
}
