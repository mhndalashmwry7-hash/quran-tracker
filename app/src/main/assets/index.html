<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0705;color:#e8b86a;font-family:serif;overflow:hidden}
body{display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#1d130b 0%,#0b0705 62%)}
#top{flex:none;padding:8px 12px 4px}
#head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px;border-radius:20px;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
 border:1px solid rgba(240,207,142,.35);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.45);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#head>div:first-child{min-width:0}
#title{font-size:19px;color:#f6dca0;text-shadow:0 2px 12px rgba(232,184,106,.25);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64vw}
#sub{font-size:11px;color:rgba(232,184,106,.65);line-height:1.3}
#pg{flex:none;font-size:13px;color:#f0cf8e;padding:3px 11px;border-radius:12px;background:rgba(240,207,142,.1);border:1px solid rgba(240,207,142,.25)}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x pan-y;scrollbar-width:none;font-size:20px}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;position:relative;box-sizing:border-box;padding:6px 8px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;isolation:isolate;contain:layout style}
.page::-webkit-scrollbar{display:none}
.pinching #pages,.pinching .page{overflow:hidden}
.busy .g,.busy .ban .bn{-webkit-backdrop-filter:none;backdrop-filter:none}
.zoom{position:relative}
.inner{text-align:justify;text-align-last:center;text-justify:inter-word;line-height:2.1}
.w{display:inline-block;position:relative;z-index:1;padding:0 3px;margin:1px 1px;opacity:.55;transition:opacity .3s,color .3s}
.w.on{opacity:1;color:#fff0cf}
.num{width:1.7em;padding:0;margin:0 4px;opacity:.95}
.num b{position:absolute;inset:0;display:grid;place-items:center;font-size:.62em;font-weight:bold;color:#1c1209;line-height:1;padding-top:.05em}
.num.on b{color:#000}
.ban{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;margin:.6em 0 .1em;padding:.3em .45em;border-radius:.5em;text-align:start;font-size:min(1em,4.4vw);
 background:repeating-linear-gradient(45deg,rgba(201,154,82,.2) 0 3px,rgba(201,154,82,.06) 3px 6px),linear-gradient(180deg,#2a1b0d,#140c05);
 border:1.5px solid #c99a52;
 box-shadow:inset 0 0 0 2px #0b0705,inset 0 0 0 3px rgba(240,207,142,.55),0 4px 14px rgba(0,0,0,.45)}
.ban .bn{flex:1;min-width:0;text-align:center;font-size:1.7em;line-height:1.8;color:#f6dca0;padding:.05em .3em;border-radius:.9em;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));
 border:1px solid rgba(240,207,142,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ban .bd{width:2.7em;height:2.7em;flex:none;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
 border:1px solid rgba(240,207,142,.6);background:radial-gradient(circle at 35% 30%,rgba(240,207,142,.25),rgba(21,12,5,.9))}
.ban .bd small{font-size:.45em;color:#e8b86a}
.ban .bd b{font-size:.75em;font-weight:normal;color:#f6dca0}
.bsm{text-align:center;font-size:min(1.6em,6.2vw);line-height:1.9;color:#f6dca0;margin:.15em 0 .3em}
.g{position:absolute;z-index:0;border-radius:999px;pointer-events:none;opacity:0;
 background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.07));
 border:1px solid rgba(255,255,255,.4);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 6px 18px rgba(0,0,0,.45);
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
 transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease,opacity .3s}
#bar{flex:none;height:62px;display:grid;place-items:center}
#b{position:relative;width:min(48vw,185px);height:38px;border-radius:19px;padding:0;outline:none;overflow:hidden;
 border:1.5px solid rgba(240,207,142,.75);
 background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 6px 18px rgba(0,0,0,.55),0 0 12px rgba(232,184,106,.18);
 animation:rise .9s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#b:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
#fill{position:absolute;top:0;bottom:0;right:0;width:0;transition:width .6s ease;
 background:linear-gradient(270deg,rgba(255,140,170,.6),rgba(255,200,160,.3))}
#sheen{position:absolute;top:0;bottom:0;width:40%;left:-50%;opacity:0;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent)}
.playing #sheen{opacity:1;animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%{left:-50%}100%{left:130%}}
#ico{position:absolute;left:5px;top:3px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
 background:rgba(240,207,142,.14);border:1px solid rgba(240,207,142,.5)}
.ic{position:absolute;width:13px;height:13px;fill:#f6dca0;transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.3,1.2)}
.play{transform:translateX(-1px)}
.stop{opacity:0;transform:scale(.4) rotate(-90deg)}
.playing .play{opacity:0;transform:scale(.4) rotate(90deg)}
.playing .stop{opacity:1;transform:none}
.playing#b{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 6px 18px rgba(0,0,0,.55),0 0 10px rgba(232,184,106,.15)}
 50%{box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 6px 18px rgba(0,0,0,.55),0 0 24px rgba(232,184,106,.4)}}
</style></head><body>
<div id="top"><div id="head"><div><div id="title"></div><div id="sub"></div></div><div id="pg"></div></div></div>
<div id="pages"></div>
<div id="bar"><button id="b" aria-label="play">
 <span id="fill"></span><span id="sheen"></span>
 <span id="ico">
  <svg class="ic play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  <svg class="ic stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
 </span></button></div>
<script src="surah.js"></script>
<script>
const pagesEl=document.getElementById('pages'),b=document.getElementById('b'),fill=document.getElementById('fill'),sub=document.getElementById('sub'),pg=document.getElementById('pg'),titleEl=document.getElementById('title');
const ar=n=>Number(n).toLocaleString('ar-EG');
const NAMES={86:'الطَّارِقِ',87:'الأَعْلَى',88:'الغَاشِيَةِ',89:'الفَجْرِ',90:'البَلَدِ',91:'الشَّمْسِ',92:'اللَّيْلِ',93:'الضُّحَى',94:'الشَّرْحِ',95:'التِّينِ',96:'العَلَقِ',97:'القَدْرِ',98:'البَيِّنَةِ',99:'الزَّلْزَلَةِ',100:'العَادِيَاتِ',101:'القَارِعَةِ',102:'التَّكَاثُرِ',103:'العَصْرِ',104:'الهُمَزَةِ',105:'الفِيلِ',106:'قُرَيْشٍ',107:'المَاعُونِ',108:'الكَوْثَرِ',109:'الكَافِرُونَ',110:'النَّصْرِ',111:'المَسَدِ',112:'الإِخْلَاصِ',113:'الفَلَقِ',114:'النَّاسِ'};
const SUR='سُورَةُ ';
const BSM=(typeof BASMALA!=='undefined'&&BASMALA)?BASMALA:'بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ';
const cnt={};
SURAH.verses.forEach(v=>{const a=v.verse_key.split(':').map(Number);cnt[a[0]]=Math.max(cnt[a[0]]||0,a[1])});
const ws=[],pages=[];
let lobes='';
for(let k=0;k<12;k++){const a=k*Math.PI/6;lobes+='<circle cx="'+(50+39*Math.sin(a)).toFixed(1)+'" cy="'+(50-39*Math.cos(a)).toFixed(1)+'" r="9"/>'}
const roseSvg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g fill="#4a3516" stroke="#d2ad63" stroke-width="1.6">'+lobes+'</g><circle cx="50" cy="50" r="37" fill="#4a3516" stroke="#d2ad63" stroke-width="1.6"/><circle cx="50" cy="50" r="33" fill="none" stroke="#d2ad63" stroke-width="1.2"/><circle cx="50" cy="50" r="29" fill="#f6eedb" stroke="#8a6a2f" stroke-width="1.6"/></svg>';
const st=document.createElement('style');
st.textContent='.num{background:url("data:image/svg+xml,'+encodeURIComponent(roseSvg)+'") center/1.7em 1.7em no-repeat}';
document.head.appendChild(st);
function newPage(n){
  const el=document.createElement('div');el.className='page';
  const zoom=document.createElement('div');zoom.className='zoom';
  const g=document.createElement('div');g.className='g';
  const inner=document.createElement('div');inner.className='inner';
  zoom.appendChild(g);zoom.appendChild(inner);el.appendChild(zoom);pagesEl.appendChild(el);
  const p={el,zoom,g,inner,n,k:pages.length,chs:[]};
  pages.push(p);return p;
}
function add(p,txt,isNum,c){
  const s=document.createElement('span');
  if(isNum){s.className='w num';s.innerHTML='&#8203;<b>'+txt+'</b>'}
  else{s.className='w';s.textContent=txt}
  s._p=p.k;s._c=c;p.inner.appendChild(s);p.inner.appendChild(document.createTextNode(' '));ws.push(s);
}
function banner(p,c){
  const d=document.createElement('div');d.className='ban';
  d.innerHTML='<div class="bd"><small>ترتيبها</small><b>'+ar(c)+'</b></div><div class="bn">'+SUR+NAMES[c]+'</div><div class="bd"><small>آياتها</small><b>'+ar(cnt[c])+'</b></div>';
  p.inner.appendChild(d);
  const m=document.createElement('div');m.className='bsm';m.textContent=BSM;p.inner.appendChild(m);
}
const byPage={};
SURAH.verses.forEach(v=>{const k=v.page_number||0;(byPage[k]=byPage[k]||[]).push(v)});
Object.keys(byPage).map(Number).sort((a,b)=>a-b).forEach(pn=>{
  const p=newPage(pn);
  byPage[pn].forEach(v=>{
    const a=v.verse_key.split(':').map(Number),c=a[0],n=a[1];
    if(p.chs.indexOf(c)<0)p.chs.push(c);
    if(n===1)banner(p,c);
    v.text_uthmani.split(' ').forEach(t=>add(p,t,false,c));
    add(p,ar(n),true,c);
  });
});
sub.textContent='الجزء '+ar(30);
let i=-1,t=null,size=20,curPage=0,lastP=-1,lock=0,flipUntil=0,flipTimer=0;

function updTitle(){
  const p=pages[curPage];
  const cs=(i>=0&&ws[i]._p===curPage)?[ws[i]._c]:p.chs;
  titleEl.textContent=SUR+cs.map(c=>NAMES[c]).join(' · ');
}
function updCount(){pg.textContent=ar(pages[curPage].n);updTitle()}
function updProg(){fill.style.width=(i<0?0:((i+1)/ws.length)*100)+'%'}
function fitPage(p){
  p.zoom.style.paddingTop='0px';
  const avail=p.el.clientHeight-12;
  p.zoom.style.paddingTop=Math.max(0,(avail-p.inner.offsetHeight)/2)+'px';
}
function fit(){pagesEl.style.fontSize=size+'px';pages.forEach(fitPage)}
function autoFit(){
  pages.forEach(p=>p.zoom.style.paddingTop='0px');
  let s;
  for(s=26;s>12;s--){
    pagesEl.style.fontSize=s+'px';
    if(pages.every(p=>p.inner.offsetHeight<=p.el.clientHeight-12))break;
  }
  size=Math.max(s,15);
  fit();
}
function place(anim,instant){
  if(Date.now()<flipUntil)return;
  const w=ws[i];
  pages.forEach((p,k)=>{if(!w||k!==w._p)p.g.style.opacity=0});
  if(!w)return;
  const g=pages[w._p].g,same=(w._p===lastP);
  g.style.transition=(anim&&same)?'':'none';
  g.style.left=(w.offsetLeft-3)+'px';
  g.style.top=(w.offsetTop-2)+'px';
  g.style.width=(w.offsetWidth+6)+'px';
  g.style.height=(w.offsetHeight+4)+'px';
  if(instant||same){g.style.opacity=1}
  else{requestAnimationFrame(()=>{g.style.transition='opacity .4s ease';g.style.opacity=1})}
  lastP=w._p;
}
function follow(w){
  const p=pages[w._p],el=p.el;
  if(el.scrollHeight<=el.clientHeight+2)return;
  const h=el.clientHeight;
  const y=p.zoom.offsetTop+w.offsetTop+w.offsetHeight/2-el.scrollTop;
  if(y<h*.28||y>h*.62)el.scrollTo({top:p.zoom.offsetTop+w.offsetTop-h*.4,behavior:'smooth'});
}
function showPage(k){
  curPage=k;lock=Date.now()+700;updCount();
  pages[k].el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function stop(){clearInterval(t);t=null;b.classList.remove('playing')}
function go(){
  if(i>=0)ws[i].classList.remove('on');
  i++;
  if(i>=ws.length){stop();i=-1;place(false);updProg();updTitle();return}
  ws[i].classList.add('on');
  if(ws[i]._p!==curPage&&Date.now()>lock)showPage(ws[i]._p);
  updTitle();follow(ws[i]);place(true);updProg();
}
b.onclick=()=>{
  if(t){stop();return}
  if(i<0){i=ws.findIndex(w=>w._p===curPage)-1}
  b.classList.add('playing');go();t=setInterval(go,800);
};
let rafS=0;
pagesEl.addEventListener('scroll',()=>{
  cancelAnimationFrame(rafS);
  rafS=requestAnimationFrame(()=>{
    if(Date.now()<lock)return;
    const k=Math.round(Math.abs(pagesEl.scrollLeft)/pagesEl.clientWidth);
    if(k!==curPage&&k<pages.length){curPage=k;fitPage(pages[k]);updCount()}
  });
});

/* القرصة: تكبير بصري يتبع أصابعك، ثم إعادة ترتيب سلسة عند الرفع */
let pinching=false,didPinch=false,d0=1,m0x=0,m0y=0,lmx=0,lmy=0,scd=1,ptarget=1,ox=0,oy=0,zr=null,vp0=null,pz=null,raf2=0,last=0;
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
const mid=e=>[(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2];
function clampAxis(d,v0,v1,z0,zs,o,s){
  const hi=(v0-z0)+o*(s-1),lo=v1-z0-o*(1-s)-zs*s;
  return lo>hi?(lo+hi)/2:Math.max(lo,Math.min(hi,d));
}
function applyPinch(){
  let dx=0,dy=0;
  if(scd>=1){
    dx=clampAxis(lmx-m0x,vp0.left,vp0.right,zr.left,zr.width,ox,scd);
    dy=clampAxis(lmy-m0y,vp0.top,vp0.bottom,zr.top,zr.height,oy,scd);
  }
  pz.style.transform='translate('+dx+'px,'+dy+'px) scale('+scd+')';
}
function ptick(now){
  if(!pinching){raf2=0;last=0;return}
  const dt=Math.min(50,now-(last||now));last=now;
  scd+=(ptarget-scd)*(1-Math.exp(-dt/90));
  if(Math.abs(ptarget-scd)<0.002)scd=ptarget;
  applyPinch();
  raf2=requestAnimationFrame(ptick);
}
function alignPage(){
  const pe=pages[curPage].el;
  const dx=pe.getBoundingClientRect().left-pagesEl.getBoundingClientRect().left;
  pe.scrollLeft=0;
  if(Math.abs(dx)>1){
    pagesEl.style.scrollSnapType='none';
    pagesEl.scrollLeft+=dx;
    setTimeout(()=>{pagesEl.style.scrollSnapType=''},80);
  }
}
function endFlip(){
  clearTimeout(flipTimer);flipUntil=0;
  const p=pages[curPage];
  [...p.inner.children].forEach(w=>{w.style.transition='';w.style.transform='';w.style.opacity=''});
  p.g.style.transition='none';p.g.style.transform='';
  document.body.classList.remove('busy');
  alignPage();
  place(false,true);
}
function commit(){
  const pgx=pages[curPage],z=pgx.zoom;
  if(Math.abs(ptarget-1)<0.02){
    z.style.transform='none';z.style.willChange='';document.body.classList.remove('busy');return;
  }
  const vp=pgx.el.getBoundingClientRect();
  const list=[...pgx.inner.children];
  const old=list.map(w=>w.getBoundingClientRect());
  const hasG=i>=0&&ws[i]._p===curPage;
  const gOld=hasG?pgx.g.getBoundingClientRect():null;
  let a=0,best=1e9;
  old.forEach((r,k)=>{const d=Math.hypot(r.left+r.width/2-lmx,r.top+r.height/2-lmy);if(d<best){best=d;a=k}});
  z.style.transform='none';z.style.willChange='';
  size=Math.max(12,Math.min(60,size*ptarget));
  pagesEl.style.fontSize=size+'px';
  fitPage(pgx);
  pgx.el.scrollLeft=0;
  const aN=list[a].getBoundingClientRect();
  pgx.el.scrollTop+=(aN.top+aN.height/2)-lmy;
  place(false,true);
  const nw=list.map(w=>w.getBoundingClientRect());
  const near=r=>r.bottom>vp.top-80&&r.top<vp.bottom+80&&r.right>vp.left-80&&r.left<vp.right+80;
  const maxd=Math.min(vp.width*0.3,160);
  const cl=(v,m)=>Math.max(-m,Math.min(m,v));
  const moved=[];
  list.forEach((w,k)=>{
    if(!(near(old[k])||near(nw[k])))return;
    const dx=cl(old[k].left+old[k].width/2-(nw[k].left+nw[k].width/2),maxd);
    const dy=cl(old[k].top+old[k].height/2-(nw[k].top+nw[k].height/2),maxd);
    const s=Math.max(.75,Math.min(1.3,old[k].height/(nw[k].height||1)));
    w.style.transition='none';
    w.style.opacity='0.15';
    w.style.transform='translate('+dx+'px,'+dy+'px) scale('+s+')';
    moved.push(w);
  });
  if(hasG){
    const gN=pgx.g.getBoundingClientRect();
    const dx=cl(gOld.left+gOld.width/2-(gN.left+gN.width/2),maxd);
    const dy=cl(gOld.top+gOld.height/2-(gN.top+gN.height/2),maxd);
    pgx.g.style.transition='none';
    pgx.g.style.transform='translate('+dx+'px,'+dy+'px)';
  }
  void pgx.el.offsetWidth;
  const T='transform .55s cubic-bezier(.22,.9,.3,1)';
  moved.forEach(w=>{w.style.transition=T+',opacity .45s ease,color .3s';w.style.transform='';w.style.opacity=''});
  if(hasG){pgx.g.style.transition=T;pgx.g.style.transform=''}
  flipUntil=Date.now()+620;
  flipTimer=setTimeout(endFlip,640);
  pages.forEach((p,k)=>{if(p!==pgx)setTimeout(()=>fitPage(p),900+k*40)});
}
document.addEventListener('touchstart',e=>{
  if(e.touches.length>=2){
    if(e.cancelable)e.preventDefault();
    if(!pinching){
      if(Date.now()<flipUntil)endFlip();
      pinching=true;didPinch=true;
      document.body.classList.add('pinching','busy');
      pz=pages[curPage].zoom;
      pz.style.transition='none';pz.style.transform='none';pz.style.willChange='transform';
      zr=pz.getBoundingClientRect();vp0=pages[curPage].el.getBoundingClientRect();
      d0=dist(e)||1;const m=mid(e);m0x=lmx=m[0];m0y=lmy=m[1];
      ox=m0x-zr.left;oy=m0y-zr.top;
      pz.style.transformOrigin=ox+'px '+oy+'px';
      scd=ptarget=1;last=0;
      raf2=requestAnimationFrame(ptick);
    }
  }
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(pinching&&e.touches.length>=2){
    if(e.cancelable)e.preventDefault();
    ptarget=Math.max(12/size,Math.min(60/size,dist(e)/d0));
    const m=mid(e);lmx=m[0];lmy=m[1];
  }
},{passive:false});
function endPinch(e){
  const n=e.touches.length;
  if(pinching&&n<2){
    pinching=false;
    cancelAnimationFrame(raf2);raf2=0;last=0;
    commit();
  }
  if(n===0&&didPinch){
    didPinch=false;
    document.body.classList.remove('pinching');
    alignPage();
  }
}
document.addEventListener('touchend',endPinch,{passive:true});
document.addEventListener('touchcancel',endPinch,{passive:true});
window.addEventListener('resize',()=>{fit();place(false,true)});
autoFit();
curPage=0;pages[0].el.scrollIntoView({inline:'center',block:'nearest'});
updCount();updProg();
</script></body></html>
