<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0705;color:#e8b86a;font-family:serif;overflow:hidden}
body{display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#1d130b 0%,#0b0705 62%);--bar:70px}
#top{flex:none;padding:calc(6px + var(--st,0px)) 12px 4px;position:relative}
#mini{display:flex;opacity:0;pointer-events:none;position:absolute;left:16px;right:16px;top:calc(var(--st,0px) + 26px);align-items:center;justify-content:space-between;font-size:13px;color:rgba(246,220,160,.85);transition:opacity .35s ease}
#mini span{flex:1;white-space:nowrap}
#mSu{text-align:start}
#mPg{text-align:center;font-size:14px;color:#f6dca0}
#mHz{text-align:end}
.nohead #mini{opacity:1;transition:opacity .6s ease .2s}
#head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;border-radius:20px;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
 border:1px solid rgba(240,207,142,.35);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.45);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
 transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .45s ease}
.nohead #head{transform:translateY(calc(-100% - var(--st,0px) - 20px));opacity:0;pointer-events:none}
#title{font-size:22px;color:#f6dca0;text-shadow:0 2px 12px rgba(232,184,106,.25);line-height:1.35}
#sub{font-size:11.5px;color:rgba(232,184,106,.7);line-height:1.3;margin-top:1px;white-space:nowrap}
#menuBtn{flex:none;width:42px;height:32px;display:grid;place-items:center;padding:0;margin:0;border-radius:12px;outline:none;cursor:pointer;
 background:rgba(240,207,142,.1);border:1px solid rgba(240,207,142,.25);color:#f0cf8e;transition:transform .2s ease}
#menuBtn:active{transform:scale(.94)}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x pan-y;scrollbar-width:none;font-size:17px}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;position:relative;box-sizing:border-box;padding:3px 8px calc(3px + var(--bar,70px)) 12px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;isolation:isolate}
.page::-webkit-scrollbar{display:none}
.zoom{position:relative;display:flow-root;transform-origin:0 0}
.inner{word-spacing:-.16em;text-align:justify;text-align-last:center;line-height:2.1}
.inner.mush{word-spacing:0}
.ln{display:flex;align-items:center;justify-content:space-between;white-space:nowrap;line-height:1.5}
.ln.c{justify-content:center;gap:.28em}
.ln>*{flex:none}
.ln .w,.ln .num{margin-top:0;margin-bottom:0}
.ln .ban{margin:0;width:100%;box-sizing:border-box;font-size:inherit}
.ln .bsm{margin:0;width:100%;font-size:inherit;line-height:1.3}
.w{display:inline-block;position:relative;z-index:1;padding:0 1px;margin:calc(-.2em + var(--gap,0px)) 0;opacity:.95;color:#f2d28f;transform:scale(1);
 transition:opacity .4s ease, color .4s ease, transform 0.75s cubic-bezier(0.25, 1, 0.5, 1);
 transform-origin:center center}
.w.on{opacity:1;color:#ffffff;transform:scale(1.15);text-shadow:0 0 12px rgba(255,240,207,0.6)}
.num{width:1.2em;padding:0;margin:calc(-.2em + var(--gap,0px)) 1px;opacity:.85}
.num svg{position:absolute;inset:0;width:100%;height:100%}
.num b{position:absolute;inset:0;display:grid;place-items:center;font-size:.45em;font-weight:normal;color:#f6dca0;line-height:1;padding-top:.1em}
.num.on b{color:#fff}
.ban{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;margin:.6em 0 .1em;padding:.3em .45em;border-radius:.5em;text-align:start;font-size:min(1em,4.4vw);
 background:repeating-linear-gradient(45deg,rgba(201,154,82,.2) 0 3px,rgba(201,154,82,.06) 3px 6px),linear-gradient(180deg,#2a1b0d,#140c05);
 border:1.5px solid #c99a52;
 box-shadow:inset 0 0 0 2px #0b0705,inset 0 0 0 3px rgba(240,207,142,.55),0 4px 14px rgba(0,0,0,.45)}
.ban .bn{flex:1;min-width:0;text-align:center;font-size:1.7em;line-height:1.8;color:#f6dca0;padding:.05em .3em;border-radius:.9em;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));
 border:1px solid rgba(240,207,142,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ban .bd{width:2.7em;height:2.7em;flex:none;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
 border:1px solid rgba(240,207,142,.6);background:radial-gradient(circle at 35% 30%,rgba(240,207,142,.25),rgba(21,12,5,.9))}
.ban .bd small{font-size:.45em;color:#e8b86a}
.ban .bd b{font-size:.75em;font-weight:normal;color:#f6dca0}
.bsm{text-align:center;font-size:min(2.3em,9vw);line-height:1.7;color:#f6dca0;margin:.15em 0 .3em}
.bsm .q{-webkit-text-stroke:.018em currentColor}
.bsm .r{color:#ff6a5c}
.g{position:absolute;z-index:0;border-radius:999px;pointer-events:none;opacity:0;
 background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.08));
 border:1.5px solid rgba(255,255,255,.55);
 box-shadow:inset 0 1px 2px rgba(255,255,255,.6),0 8px 24px rgba(0,0,0,.55),0 0 18px rgba(232,184,106,.35);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 transition:left 0.75s cubic-bezier(0.25, 1, 0.5, 1), top 0.75s cubic-bezier(0.25, 1, 0.5, 1), width 0.75s cubic-bezier(0.25, 1, 0.5, 1), height 0.75s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
}
.busy .g,.busy .ban .bn{-webkit-backdrop-filter:none;backdrop-filter:none}
#bar{position:fixed;left:0;right:0;bottom:14px;z-index:20;display:flex;justify-content:center;pointer-events:none}
#b{pointer-events:auto;position:relative;width:min(49vw,190px);height:50px;border-radius:25px;padding:0;margin:0;outline:none;overflow:hidden;cursor:pointer;
 color:#fff0cf;font-family:inherit;border:1.5px solid rgba(240,207,142,.85);
 background:linear-gradient(115deg,#2a170a 0%,#5e3a16 18%,#c99a52 36%,#7a4a1a 50%,#4a2a12 66%,#8f3f55 82%,#2a170a 100%);
 background-size:320% 100%;
 box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.55),0 0 16px rgba(232,184,106,.25);
 animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards,flow 7s ease-in-out infinite alternate;
 transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#b:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes flow{0%{background-position:100% 0}100%{background-position:0 0}}
#fill{position:absolute;top:0;bottom:0;right:0;width:0;overflow:hidden;transition:width .6s ease;
 background:linear-gradient(270deg,rgba(255,170,190,.6),rgba(255,214,170,.3))}
#fill::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:rgba(255,240,207,.8)}
#sheen{position:absolute;top:0;bottom:0;width:38%;left:-50%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);
 animation:sweep 4.5s ease-in-out infinite}
.playing #sheen{animation-duration:2.2s}
@keyframes sweep{0%{left:-50%}100%{left:130%}}
#face{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.ic{width:17px;height:17px;fill:#fff0cf;flex:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6));animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-90deg)}to{opacity:1;transform:none}}
.lbl{font-size:18px;line-height:1;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.stop,.l-stop{display:none}
.playing .stop{display:block}
.playing .l-stop{display:inline}
.playing .play,.playing .l-play{display:none}
.playing#b{animation:glow 2.6s ease-in-out infinite,flow 3.5s linear infinite alternate}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.55),0 0 14px rgba(232,184,106,.2)}
 50%{box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.55),0 0 30px rgba(232,184,106,.55)}}
/* ===== القائمة الجانبية الزجاجية ===== */
#scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .8s ease}
#menu{position:fixed;top:0;bottom:0;left:0;z-index:60;width:min(74vw,290px);box-sizing:border-box;padding:calc(16px + var(--st,0px)) 0 16px;
 transform:translateX(-104%);transition:transform .85s cubic-bezier(.22,1,.36,1);
 background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
 -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
 border-right:1px solid rgba(240,207,142,.35);box-shadow:8px 0 40px rgba(0,0,0,.4),inset -1px 0 1px rgba(255,255,255,.2)}
.menuopen #scrim{opacity:1;pointer-events:auto}
.menuopen #menu{transform:none}
.mi{display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;padding:16px 22px;background:none;border:0;border-bottom:1px solid rgba(240,207,142,.2);color:#f6dca0;font-family:inherit;font-size:18px;text-align:start;outline:none;cursor:pointer}
.mi .chev{transition:transform .45s ease;font-size:16px;opacity:.85}
.mi.open .chev{transform:rotate(180deg)}
.sub{max-height:0;overflow:hidden;transition:max-height .6s ease}
.sub.open{max-height:160px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;padding:13px 22px 13px 22px;background:none;border:0;color:#e8cf9a;font-family:inherit;font-size:16px;text-align:start;outline:none;cursor:pointer;transition:background .3s ease}
.opt.sel{background:rgba(240,207,142,.14);color:#fff0cf}
.opt.sel::after{content:'✓'}
/* ===== المظهر الفاتح ===== */
body.light{background:#fff;color:#111}
body.light #head{background:linear-gradient(145deg,rgba(0,0,0,.07),rgba(0,0,0,.02));border-color:rgba(0,0,0,.28);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 6px 18px rgba(0,0,0,.12)}
body.light #title{color:#111;text-shadow:none}
body.light #sub{color:rgba(0,0,0,.55)}
body.light #mini{color:rgba(0,0,0,.7)}
body.light #mPg{color:#111}
body.light #menuBtn{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.3);color:#111}
body.light .w{color:#111}
body.light .w.on{color:#000;text-shadow:0 0 10px rgba(0,0,0,.25)}
body.light .num b{color:#111}
body.light .num.on b{color:#000}
body.light .g{background:linear-gradient(145deg,rgba(0,0,0,.16),rgba(0,0,0,.05));border-color:rgba(0,0,0,.4);box-shadow:inset 0 1px 2px rgba(255,255,255,.6),0 6px 18px rgba(0,0,0,.2)}
body.light .ban{background:repeating-linear-gradient(45deg,rgba(0,0,0,.09) 0 3px,rgba(0,0,0,.02) 3px 6px),#f4f4f4;border-color:#222;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.15)}
body.light .ban .bn{color:#111;background:linear-gradient(145deg,rgba(0,0,0,.06),rgba(0,0,0,.01));border-color:rgba(0,0,0,.4)}
body.light .ban .bd{border-color:rgba(0,0,0,.5);background:radial-gradient(circle at 35% 30%,rgba(0,0,0,.1),rgba(0,0,0,.02))}
body.light .ban .bd small{color:#444}
body.light .ban .bd b{color:#111}
body.light .bsm{color:#111}
body.light .bsm .r{color:#d3281c}
body.light #scrim{background:rgba(0,0,0,.18)}
body.light #menu{background:linear-gradient(160deg,rgba(255,255,255,.58),rgba(240,240,240,.36));border-right-color:rgba(0,0,0,.2);box-shadow:8px 0 40px rgba(0,0,0,.15),inset -1px 0 1px rgba(255,255,255,.7)}
body.light .mi{color:#111;border-bottom-color:rgba(0,0,0,.15)}
body.light .opt{color:#222}
body.light .opt.sel{background:rgba(0,0,0,.08);color:#000}
</style></head><body>
<div id="top"><div id="head"><div><div id="title">سُورَةُ الطَّارِقِ</div><div id="sub">الصفحة ٥٩١ · الجزء ٣٠ · الحزب ٥٩ - ٦٠</div></div><button id="menuBtn" aria-label="menu"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button><div id="pg" style="display:none"></div></div><div id="mini"><span id="mSu"></span><span id="mPg"></span><span id="mHz"></span></div></div>
<div id="pages"></div>
<div id="bar"><button id="b" aria-label="play">
 <span id="fill"></span><span id="sheen"></span>
 <span id="face">
  <svg class="ic play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  <svg class="ic stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
  <span class="lbl l-play">ابدأ التلاوة</span><span class="lbl l-stop">إيقاف</span>
 </span></button></div>
<div id="scrim"></div>
<aside id="menu">
 <button class="mi" id="miTheme"><span>المظهر</span><span class="chev">▾</span></button>
 <div class="sub" id="subTheme">
  <button class="opt" data-th="dark"><span>داكن</span></button>
  <button class="opt" data-th="light"><span>فاتح</span></button>
 </div>
</aside>
<script src="surah.js"></script>
<script>
const pagesEl=document.getElementById('pages'),b=document.getElementById('b'),fill=document.getElementById('fill'),sub=document.getElementById('sub'),pg=document.getElementById('pg'),titleEl=document.getElementById('title');
const mSu=document.getElementById('mSu'),mPg=document.getElementById('mPg'),mHz=document.getElementById('mHz');
const ar=n=>Number(n).toLocaleString('ar-EG');
const ws=[],pages=[],pmap={},fs=[],cinfo={};
const MAXS=1.35;
const BARH=70;
const AV=el=>el.clientHeight-6-BARH;
const NAMES={86:'الطَّارِقِ',87:'الأَعْلَى',88:'الغَاشِيَةِ',89:'الفَجْرِ',90:'البَلَدِ',91:'الشَّمْسِ',92:'اللَّيْلِ',93:'الضُّحَى',94:'الشَّرْحِ',95:'التِّينِ',96:'العَلَقِ',97:'القَدْرِ',98:'البَيِّنَةِ',99:'الزَّلْزَلَةِ',100:'العَادِيَاتِ',101:'القَارِعَةِ',102:'التَّكَاثُرِ',103:'العَصْرِ',104:'الهُمَزَةِ',105:'الفِيلِ',106:'قُرَيْشٍ',107:'المَاعُونِ',108:'الكَوْثَرِ',109:'الكَافِرُونَ',110:'النَّصْرِ',111:'المَسَدِ',112:'الإِخْلَاصِ',113:'الفَلَقِ',114:'النَّاسِ'};
const SUR='سُورَةُ ';
const BSM=(typeof BASMALA!=='undefined'&&BASMALA)?BASMALA:'بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ';
const cnt={};
SURAH.verses.forEach(v=>{const a=v.verse_key.split(':').map(Number);cnt[a[0]]=Math.max(cnt[a[0]]||0,a[1])});
const ROSE='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none" stroke="#e3b866" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="62" r="41"/><ellipse cx="50" cy="62" rx="37.500" ry="21"/><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/><path d="M46.500 15.500C41 11 35 14 35 24"/><g transform="translate(100,0) scale(-1,1)"><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/><path d="M46.500 15.500C41 11 35 14 35 24"/></g><g transform="translate(0,124) scale(1,-1)"><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/></g><g transform="translate(0,124) scale(1,-1)"><g transform="translate(100,0) scale(-1,1)"><path d="M12 58C13 44 26 32 40.500 31.500C32 36 24 44 12 58Z" fill="#e3b866" stroke="none"/><circle cx="43.500" cy="35" r="3.800"/><circle cx="43.500" cy="35" r="1.100" fill="#e3b866" stroke="none"/></g></g><path d="M50 3.500C47 6.800 47 10.200 50 13.500C53 10.200 53 6.800 50 3.500Z" fill="#e3b866" stroke="none"/><circle cx="50" cy="19" r="2.200" fill="#e3b866" stroke="none"/><path d="M35 100.500C34 110 42 111 45.500 106C47 112 53 112 54.500 106C58 111 66 110 65 100.500"/></svg>';
const ROSE_L=ROSE.split('#e3b866').join('#1d1d1d');
const roseStyle=document.createElement('style');
roseStyle.textContent='.num{background:url("data:image/svg+xml,'+encodeURIComponent(ROSE)+'") center/auto 1.4em no-repeat}body.light .num{background-image:url("data:image/svg+xml,'+encodeURIComponent(ROSE_L)+'")}';
document.head.appendChild(roseStyle);

/* خط المصحف المدني (QCF V1) من خوادم Quran Foundation */
const QBASE='https://verses.quran.foundation/fonts/quran/hafs/v1/woff2/p';
const qready={};
function loadQ(pn){
  return new FontFace('qv1-'+pn,'url('+QBASE+pn+'.woff2)').load()
    .then(f=>{document.fonts.add(f);qready[pn]=true})
    .catch(()=>{qready[pn]=false});
}
function loadAll(){
  if(typeof FontFace==='undefined')return Promise.resolve();
  const need=new Set();
  SURAH.verses.forEach(v=>(v.words||[]).forEach(w=>need.add(w.p)));
  if(typeof BASMALA_W!=='undefined')BASMALA_W.forEach(w=>need.add(w.p));
  return Promise.race([Promise.all([...need].map(loadQ)),new Promise(r=>setTimeout(r,7000))]);
}

function newPage(n){
  const el=document.createElement('div');el.className='page';
  const z=document.createElement('div');z.className='zoom';
  const g=document.createElement('div');g.className='g';
  const inner=document.createElement('div');inner.className='inner';
  z.appendChild(g);z.appendChild(inner);el.appendChild(z);pagesEl.appendChild(el);
  const p={el,z,g,inner,n,k:pages.length,words:[],items:[],seq:[],mode:'flow',canMush:true,rows:null,stale:true};
  pages.push(p);return p;
}
function pageOf(pn){return pmap[pn]||(pmap[pn]=newPage(pn))}
function add(p,txt,isNum,w,row,c){
  const s=document.createElement('span');
  if(isNum){
    s.className='w num';s.innerHTML='&#8203;<b>'+txt+'</b>';
    const pr=p.seq[p.seq.length-1];if(pr)pr.sp=false;
  }
  else if(w&&qready[w.p]){s.className='w q';s.style.fontFamily="'qv1-"+w.p+"'";s.innerHTML=w.c}
  else{s.className='w';s.textContent=txt}
  s._p=p.k;s._c=c;
  if(row==null)p.canMush=false;
  p.seq.push({el:s,row:row,sp:!isNum});
  p.words.push(s);p.items.push(s);ws.push(s);
}
function banner(p,c,L0){
  const d=document.createElement('div');d.className='ban';
  d.innerHTML='<div class="bd"><small>ترتيبها</small><b>'+ar(c)+'</b></div><div class="bn">'+SUR+NAMES[c]+'</div><div class="bd"><small>آياتها</small><b>'+ar(cnt[c])+'</b></div>';
  const m=document.createElement('div');m.className='bsm';
  if(typeof BASMALA_W!=='undefined'&&BASMALA_W.length&&BASMALA_W.every(w=>qready[w.p])){
    BASMALA_W.forEach((w,k)=>{
      const s=document.createElement('span');
      s.className=k===1?'q r':'q';s.style.fontFamily="'qv1-"+w.p+"'";s.innerHTML=w.c;m.appendChild(s);
      if(k<BASMALA_W.length-1)m.appendChild(document.createTextNode(' '));
    });
  }else m.textContent=BSM;
  let pb=p,pm=p,rb=null,rm=null;
  if(L0==null){p.canMush=false}
  else if(L0>=3){rb=L0-2;rm=L0-1}
  else if(L0===2){rm=1;pb=pmap[p.n-1]||null;rb=15}
  else{pb=pmap[p.n-1]||null;pm=pb;rb=14;rm=15}
  if(pb){pb.seq.push({el:d,row:rb,sp:false});pb.items.push(d)}
  if(pm){pm.seq.push({el:m,row:rm,sp:false});pm.items.push(m)}
}
function build(){
  SURAH.verses.forEach(v=>{
    const a=v.verse_key.split(':').map(Number),c=a[0],n=a[1];
    const wl=(v.words&&v.words.length)?v.words:null;
    const first=wl?wl[0].p:(v.page_number||591);
    const last=wl?wl[wl.length-1].p:first;
    if(n===1)banner(pageOf(first),c,wl?wl[0].l:null);
    if(wl)wl.forEach(w=>add(pageOf(w.p),w.t,false,w,w.l,c));
    else v.text_uthmani.split(' ').forEach(t=>add(pageOf(first),t,false,null,null,c));
    add(pageOf(last),ar(n),true,null,wl?wl[wl.length-1].l:null,c);
  });
}
function mkInfo(){
  ws.forEach((w,k)=>{
    const o=cinfo[w._c]||(cinfo[w._c]={a:k,n:0});

}
let i=-1,t=null,mul=1,curPage=0,lastP=-1,lock=0,ready=false,progCh=-1,lastPE=0,lastZoom=1;

/* امتداد الشاشة تحت شريط الإشعارات */

function chOfPage(p){const a=[];p.words.forEach(w=>{if(a.indexOf(w._c)<0)a.push(w._c)});return a}
function updHead(){

function resetFill(){fill.style.transition='none';fill.style.width='0%';void fill.offsetWidth;fill.style.transition=''}
function updProg(){

function land(){return window.innerWidth>window.innerHeight*1.1}
function mm(k){return Math.max(1.6,50/fs[k])}

/* ===== وضع أسطر المصحف (١٥ سطراً ثابتة) ===== */
function toMush(p){
  p.inner.textContent='';p.inner.classList.add('mush');
  p.rows=[];
  for(let r=1;r<=15;r++){const d=document.createElement('div');d.className='ln';p.inner.appendChild(d);p.rows[r]=d}
  p.seq.forEach(it=>{
    it.el.style.scale='';it.el.style.marginLeft='';it.el.style.marginRight='';it.el._sx=1;
    if(it.row!=null&&p.rows[it.row])p.rows[it.row].appendChild(it.el);
  });
  p.mode='mush';
}
function toFlow(p){
  p.inner.classList.remove('mush');p.inner.textContent='';p.inner.style.height='';
  const fr=document.createDocumentFragment();
  p.seq.forEach(it=>{
    it.el.style.scale='';it.el.style.marginLeft='';it.el.style.marginRight='';it.el._sx=1;
    fr.appendChild(it.el);
    if(it.sp)fr.appendChild(document.createTextNode(' '));
  });
  p.inner.appendChild(fr);
  p.rows=null;p.mode='flow';
}
function natW(d){
  let s=0;const k=d.children;
  for(let j=0;j<k.length;j++){const c=k[j];s+=c.getBoundingClientRect().width+(c.classList.contains('num')?2:0)}
  return s;
}
function clearRow(d){[...d.children].forEach(c=>{c.style.scale='';c.style.marginLeft='';c.style.marginRight='';c._sx=1})}
function layoutMush(p){
  const el=p.el,Hv=AV(el),L=land();
  let rh=Hv/15;
  p.z.style.paddingTop='0px';
  p.inner.style.marginTop='0px';
  const wrows=[];
  p.rows.forEach(d=>{
    if(!d)return;
    clearRow(d);d.classList.remove('c');
    if(d.querySelector('.ban')||d.querySelector('.bsm'))return;
    d.style.fontSize='';
    if(d.children.length)wrows.push(d);
  });
  const C=p.inner.clientWidth;
  let f=40;
  for(let pass=0;pass<2;pass++){
    el.style.fontSize=f+'px';
    let mx=0;wrows.forEach(d=>{mx=Math.max(mx,natW(d))});
    if(!mx)break;
    f=Math.max(9,Math.min(L?90:rh*0.95,f*C/mx*0.985));
  }
  if(L)rh=Math.max(rh,f*1.6);
  p.inner.style.height=(rh*15)+'px';
  p.rows.forEach(d=>{
    if(!d)return;
    d.style.height=rh+'px';
    if(d.querySelector('.ban'))d.style.fontSize=(rh*0.27)+'px';
    else if(d.querySelector('.bsm'))d.style.fontSize=(rh*0.74)+'px';
  });
  el.style.fontSize=f+'px';
  fs[p.k]=f;
  /* قراءة كل القياسات أولاً ثم الكتابة (بدون إعادة حساب متكررة) */
  const plans=[];
  wrows.forEach(d=>{
    const nat=natW(d),left=C-nat;
    if(nat/C<0.8){plans.push({d:d,c:true});return}
    let sw=0;const lst=[];
    [...d.children].forEach(c=>{if(!c.classList.contains('num')){const w=c.getBoundingClientRect().width;sw+=w;lst.push([c,w])}});
    if(left<=0.5||!sw)return;
    const s=Math.min(MAXS,1+left*0.9/sw);
    if(s<1.003)return;
    plans.push({d:d,s:s,lst:lst});
  });
  plans.forEach(o=>{
    if(o.c){o.d.classList.add('c');return}
    o.lst.forEach(a=>{
      const ex=a[1]*(o.s-1)/2;
      a[0].style.scale=o.s+' 1';a[0].style.marginLeft=a[0].style.marginRight=ex+'px';a[0]._sx=o.s;
    });
  });
}

/* ===== وضع التكبير (الكلمات تنزل للأسطر) ===== */
function clearStretch(p){
  p.words.forEach(w=>{w.style.scale='';w.style.marginLeft='';w.style.marginRight='';w._sx=1});
  p.inner.style.textAlign='';p.inner.style.textAlignLast='';
}
function stretchPage(p){
  clearStretch(p);
  const C=p.inner.clientWidth;
  if(!C||!p.words.length)return;
  p.inner.style.textAlign='start';p.inner.style.textAlignLast='start';
  const lines=[];let cur=[],top=null;
  p.words.forEach(w=>{
    const tp=w.offsetTop;
    if(top===null||Math.abs(tp-top)>6){if(cur.length)lines.push(cur);cur=[];top=tp}
    cur.push(w);
  });
  if(cur.length)lines.push(cur);
  const plan=[];
  lines.forEach(L=>{
    const r=L.map(w=>w.getBoundingClientRect());
    let l=1e9,rr=-1e9,sw=0;
    r.forEach((q,k)=>{l=Math.min(l,q.left);rr=Math.max(rr,q.right);if(!L[k].classList.contains('num'))sw+=q.width});
    const left=C-(rr-l);
    if(left<=1||left/C>0.28||!sw)return;
    const s=Math.min(MAXS,1+left*0.96/sw);
    if(s<1.002)return;
    L.forEach((w,k)=>{if(!w.classList.contains('num'))plan.push([w,s,r[k].width*(s-1)/2])});
  });
  plan.forEach(a=>{a[0].style.scale=a[1]+' 1';a[0].style.marginLeft=a[0].style.marginRight=a[2]+'px';a[0]._sx=a[1]});
  p.inner.style.textAlign='';p.inner.style.textAlignLast='';
}
function lineCount(p,fpx){
  const tp=p.words.map(w=>w.offsetTop).sort((a,b)=>a-b);
  let n=1;
  for(let k=1;k<tp.length;k++)if(tp[k]-tp[k-1]>fpx*0.9)n++;
  return n;
}
function flowFit(p){
  stretchPage(p);
  const avail=AV(p.el);
  p.z.style.setProperty('--gap','0px');
  p.inner.style.marginTop='0px';
  const h=p.inner.offsetHeight;
  if(h<avail&&p.words.length){
    const fpx=parseFloat(getComputedStyle(p.el).fontSize)||16;
    const g=Math.min((avail-h)/(2*lineCount(p,fpx)),fpx*.45);
    p.z.style.setProperty('--gap',g+'px');
  }
  p.inner.style.marginTop=Math.max(0,(avail-p.inner.offsetHeight)/2)+'px';
}
function applyMode(p){
  const want=(mul<=1&&p.canMush)?'mush':'flow';
  if(p.mode!==want){if(want==='mush')toMush(p);else toFlow(p)}
  if(p.mode==='mush')layoutMush(p);
  else{p.el.style.fontSize=(fs[p.k]*mul)+'px';flowFit(p)}
}

/* ترتيب الصفحة الحالية فوراً، وباقي الصفحات عند الحاجة فقط */
function ensure(p){
  if(!p||!p.stale)return;
  p.stale=false;
  p.z.style.paddingTop='0px';
  if(!p.canMush&&fs[p.k]==null){
    if(p.mode!=='flow')toFlow(p);
    p.el.style.fontSize='';p.inner.style.marginTop='0px';p.z.style.setProperty('--gap','0px');
    let lo=12,hi=24;
    while(lo<hi){
      const m=Math.ceil((lo+hi)/2);
      p.el.style.fontSize=m+'px';
      if(p.inner.offsetHeight<=AV(p.el))lo=m;else hi=m-1;
    }
    fs[p.k]=lo;
  }
  applyMode(p);
}
function warm(){
  [curPage-1,curPage+1].forEach(k=>{
    const q=pages[k];
    if(q&&q.stale)setTimeout(()=>{ensure(q);if(i>=0&&ws[i]._p===q.k)place(false,true)},90);
  });
}
function autoFit(){
  mul=1;
  pages.forEach(p=>{p.stale=true;if(!p.canMush)fs[p.k]=null});
  ensure(pages[curPage]);
  warm();
}
function place(anim,instant){
  const w=ws[i];
  pages.forEach((p,k)=>{if(!w||k!==w._p)p.g.style.opacity=0});
  if(!w)return;
  const g=pages[w._p].g,same=(w._p===lastP);
  const sx=w._sx||1,ow=w.offsetWidth*sx,ol=w.offsetLeft-(ow-w.offsetWidth)/2;
  const hh=w.offsetHeight,gh=(hh+6)*0.86;
  g.style.transition=(anim&&same)?'':'none';
  g.style.left=(ol-5)+'px';
  g.style.top=(w.offsetTop+(hh-gh)/2)+'px';
  g.style.width=(ow+10)+'px';
  g.style.height=gh+'px';
  if(instant||same){g.style.opacity=1}
  else{requestAnimationFrame(()=>{g.style.transition='left 0.75s cubic-bezier(0.25, 1, 0.5, 1), top 0.75s cubic-bezier(0.25, 1, 0.5, 1), width 0.75s cubic-bezier(0.25, 1, 0.5, 1), height 0.75s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease';g.style.opacity=1})}
  lastP=w._p;
}
function follow(w){
  const p=pages[w._p],el=p.el;
  if(el.scrollHeight>el.clientHeight+2)el.scrollTo({top:w.offsetTop+p.z.offsetTop-el.clientHeight/2,behavior:'smooth'});
}
function showPage(k){
  ensure(pages[k]);
  curPage=k;lock=Date.now()+700;updCount();
  pages[k].el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  warm();
}
function stop(){clearInterval(t);t=null;b.classList.remove('playing')}
function go(){
  if(i>=0)ws[i].classList.remove('on');
  i++;
  while(i<ws.length&&ws[i].classList.contains('num'))i++;
  if(i>=ws.length){stop();i=-1;place(false);updProg();updMini();return}
  ensure(pages[ws[i]._p]);
  ws[i].classList.add('on');
  if(ws[i]._p!==curPage&&Date.now()>lock)showPage(ws[i]._p);
  follow(ws[i]);place(true);updProg();updMini();
}
b.onclick=()=>{
  if(!ready)return;
  if(t){stop();return}
  if(i<0){i=ws.findIndex(w=>w._p===curPage)-1}
  b.classList.add('playing');go();t=setInterval(go,800);
};
let rafS=0;
pagesEl.addEventListener('scroll',()=>{
  cancelAnimationFrame(rafS);
  rafS=requestAnimationFrame(()=>{
    if(Date.now()<lock)return;
    const k=Math.round(Math.abs(pagesEl.scrollLeft)/pagesEl.clientWidth);
    if(k!==curPage&&k<pages.length){curPage=k;ensure(pages[k]);updCount();warm()}
  });
});

/* القائمة الجانبية والمظهر */
const menuBtn=document.getElementById('menuBtn'),scrim=document.getElementById('scrim'),miTheme=document.getElementById('miTheme'),subTheme=document.getElementById('subTheme');
function setTheme(th){

let pinch=null,flipT=0,flipPage=null,raf=0;
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
const mid=e=>({x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2});

function cleanFlip(){
  clearTimeout(flipT);
  document.body.classList.remove('busy');
  if(!flipPage)return;
  flipPage.items.forEach(w=>{w.style.transition='';w.style.transform='';w.style.transformOrigin=''});
  flipPage.g.style.transition='none';flipPage.g.style.transform='';flipPage.g.style.transformOrigin='';
  flipPage=null;
}

function commit(p,s,anchor){
  if(Math.abs(s-1)<0.02){
    p.z.style.transform='';p.z.style.transformOrigin='';p.z.style.willChange='';
    document.body.classList.remove('busy');
    return;
  }
  let nm=Math.max(1,Math.min(mm(p.k),mul*s));
  if(nm<1.04)nm=1;
  const vp=p.el.getBoundingClientRect();
  const olds=p.items.map(w=>w.getBoundingClientRect());
  let ai=-1;
  if(anchor){
    let best=1e9;
    p.items.forEach((w,j)=>{const o=olds[j];if(!o.width)return;const d=Math.hypot(o.left+o.width/2-anchor.x,o.top+o.height/2-anchor.y);if(d<best){best=d;ai=j}});
  }
  const og=p.g.getBoundingClientRect();
  const gVisible=p.g.style.opacity==='1';
  p.z.style.transition='none';p.z.style.transform='';p.z.style.transformOrigin='';p.z.style.willChange='';
  mul=nm;if(nm>1)lastZoom=nm;
  applyMode(p);
  if(ai>=0){const r=p.items[ai].getBoundingClientRect();p.el.scrollTop+=(r.top+r.height/2)-anchor.y}
  place(false,true);
  const news=p.items.map(w=>w.getBoundingClientRect());
  const ng=p.g.getBoundingClientRect();
  const near=r=>r.bottom>vp.top-60&&r.top<vp.bottom+60&&r.right>vp.left-60&&r.left<vp.right+60;
  const moved=[];
  p.items.forEach((w,j)=>{
    const o=olds[j],n=news[j];
    if(!n.width||!o.width)return;
    if(!(near(o)||near(n)))return;
    w.style.transition='none';w.style.transformOrigin='0 0';
    w.style.transform='translate('+(o.left-n.left)+'px,'+(o.top-n.top)+'px) scale('+(o.width/n.width)+')';
    moved.push(w);
  });
  if(gVisible&&ng.width){
    p.g.style.transition='none';p.g.style.transformOrigin='0 0';
    p.g.style.transform='translate('+(og.left-ng.left)+'px,'+(og.top-ng.top)+'px) scale('+(og.width/ng.width)+','+(og.height/ng.height)+')';
  }
  void p.el.offsetWidth;
  const T='transform .5s cubic-bezier(.2,.8,.2,1)';
  moved.forEach(w=>{w.style.transition=T;w.style.transform=''});
  if(gVisible){p.g.style.transition=T;p.g.style.transform=''}
  flipPage=p;
  flipT=setTimeout(cleanFlip,580);
  /* باقي الصفحات تتحدث لما تحتاجها فقط */
  pages.forEach(q=>{if(q!==p)q.stale=true});
  setTimeout(warm,750);
}

/* ===== اللمس: ضغطة واحدة (القائمة العلوية ترتفع/تنزل) ومرتين (تكبير/رجوع) ===== */
function singleTap(){document.body.classList.toggle('nohead')}
function doubleTap(x,y){
  const p=pages[curPage];if(!p)return;
  cleanFlip();
  if(mul>1)commit(p,1/mul,{x:x,y:y});
  else commit(p,Math.min(mm(p.k),lastZoom>1?lastZoom:1.9),{x:x,y:y});
}
let tapT=0,lastTapT=0,lastTapX=0,lastTapY=0,tdown=null;
pagesEl.addEventListener('touchstart',e=>{
  if(e.touches.length===1){const q=e.touches[0];tdown={x:q.clientX,y:q.clientY,t:Date.now(),ok:true}}
  else if(tdown)tdown.ok=false;
},{passive:true});
pagesEl.addEventListener('touchmove',e=>{
  if(!tdown)return;
  const q=e.touches[0];
  if(Math.hypot(q.clientX-tdown.x,q.clientY-tdown.y)>12)tdown.ok=false;
},{passive:true});
pagesEl.addEventListener('touchend',e=>{
  if(!tdown)return;
  if(e.touches.length>0){tdown.ok=false;return}
  const d=tdown;tdown=null;
  const now=Date.now();
  if(!d.ok||pinch||!ready||now-lastPE<500||now-d.t>350)return;
  if(now-lastTapT<320&&Math.hypot(d.x-lastTapX,d.y-lastTapY)<50){
    clearTimeout(tapT);lastTapT=0;doubleTap(d.x,d.y);
  }else{
    lastTapT=now;lastTapX=d.x;lastTapY=d.y;
    clearTimeout(tapT);
    tapT=setTimeout(()=>{if(!pinch)singleTap()},330);
  }
},{passive:true});

function applyPinch(){
  raf=0;
  if(!pinch)return;
  pinch.p.z.style.transform='translate3d('+pinch.dx+'px,'+pinch.dy+'px,0) scale('+pinch.s+')';
}
document.addEventListener('touchstart',e=>{
  if(e.touches.length>=2){
    if(e.cancelable)e.preventDefault();
    if(pinch||!ready)return;
    clearTimeout(tapT);lastTapT=0;
    cleanFlip();
    document.body.classList.add('busy');
    const p=pages[curPage],r=p.z.getBoundingClientRect(),c=mid(e);
    pinch={p,d0:dist(e)||1,c0:c,s:1,dx:0,dy:0};
    p.z.style.transition='none';
    p.z.style.transformOrigin=(c.x-r.left)+'px '+(c.y-r.top)+'px';
    p.z.style.willChange='transform';
  }
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length>=2){
    if(e.cancelable)e.preventDefault();
    const c=mid(e);
    pinch.s=Math.max(1/mul,Math.min(mm(curPage)/mul,dist(e)/pinch.d0));
    pinch.dx=c.x-pinch.c0.x;pinch.dy=c.y-pinch.c0.y;
    if(!raf)raf=requestAnimationFrame(applyPinch);
  }
},{passive:false});
function endPinch(e){
  if(pinch&&e.touches.length<2){
    cancelAnimationFrame(raf);raf=0;
    const {p,s,dx,dy,c0}=pinch;pinch=null;lastPE=Date.now();
    p.z.style.transform='translate3d('+dx+'px,'+dy+'px,0) scale('+s+')';
    commit(p,s,{x:c0.x+dx,y:c0.y+dy});
  }
}
document.addEventListener('touchend',endPinch);
document.addEventListener('touchcancel',endPinch);

/* إعادة الترتيب تلقائياً لما يتغير حجم منطقة الصفحات (شريط الإشعارات، تدوير الشاشة...) */
let roT=0,lastRO='';
function relayout(){
  const k=pagesEl.clientWidth+'x'+pagesEl.clientHeight;
  if(k===lastRO)return;
  lastRO=k;
  clearTimeout(roT);
  roT=setTimeout(()=>{
    applyInset();autoFit();place(false,true);
    pages[curPage].el.scrollIntoView({inline:'center',block:'nearest'});
  },80);
}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{if(ready)relayout()}).observe(pagesEl);
window.addEventListener('resize',()=>{if(ready)relayout()});

function start(){
  pagesEl.innerHTML='';
  build();
  mkInfo();
  curPage=0;
  updCount();updProg();
  autoFit();
  pages[0].el.scrollIntoView({inline:'center',block:'nearest'});
  lastRO=pagesEl.clientWidth+'x'+pagesEl.clientHeight;
