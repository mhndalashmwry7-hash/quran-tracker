<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0705;color:#e8b86a;font-family:serif;overflow:hidden}
body{display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#1d130b 0%,#0b0705 62%)}
#top{flex:none;padding:16px 14px 6px}
#head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-radius:26px;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
 border:1px solid rgba(240,207,142,.35);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.45);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#title{font-size:24px;color:#f6dca0;text-shadow:0 2px 12px rgba(232,184,106,.25)}
#sub{font-size:12px;color:rgba(232,184,106,.65);margin-top:2px}
#pg{font-size:15px;color:#f0cf8e;padding:6px 14px;border-radius:16px;background:rgba(240,207,142,.1);border:1px solid rgba(240,207,142,.25)}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:none;font-size:26px}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;position:relative;box-sizing:border-box;padding:6px 22px;overflow:hidden;isolation:isolate}
.inner{text-align:center;line-height:2.3}
.w{display:inline-block;position:relative;z-index:1;padding:0 8px;margin:2px;opacity:.55;transition:opacity .3s,color .3s}
.w.on{opacity:1;color:#fff0cf}
.g{position:absolute;z-index:0;border-radius:999px;pointer-events:none;opacity:0;
 background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.07));
 border:1px solid rgba(255,255,255,.4);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 6px 18px rgba(0,0,0,.45);
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
 transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease,opacity .3s}
#bar{flex:none;height:104px;display:grid;place-items:center}
#b{position:relative;width:min(78vw,300px);height:58px;border-radius:29px;padding:0;outline:none;overflow:hidden;
 border:1.5px solid rgba(240,207,142,.75);
 background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 10px 26px rgba(0,0,0,.55),0 0 18px rgba(232,184,106,.18);
 animation:rise .9s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#b:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
#fill{position:absolute;top:0;bottom:0;right:0;width:0;transition:width .6s ease;
 background:linear-gradient(270deg,rgba(255,140,170,.6),rgba(255,200,160,.3))}
#sheen{position:absolute;top:0;bottom:0;width:40%;left:-50%;opacity:0;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent)}
.playing #sheen{opacity:1;animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%{left:-50%}100%{left:130%}}
#ico{position:absolute;left:9px;top:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
 background:rgba(240,207,142,.14);border:1px solid rgba(240,207,142,.5)}
.ic{position:absolute;width:18px;height:18px;fill:#f6dca0;transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.3,1.2)}
.play{transform:translateX(-1px)}
.stop{opacity:0;transform:scale(.4) rotate(-90deg)}
.playing .play{opacity:0;transform:scale(.4) rotate(90deg)}
.playing .stop{opacity:1;transform:none}
.playing#b{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 10px 26px rgba(0,0,0,.55),0 0 14px rgba(232,184,106,.15)}
 50%{box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 10px 26px rgba(0,0,0,.55),0 0 30px rgba(232,184,106,.4)}}
</style></head><body>
<div id="top"><div id="head"><div><div id="title">سورة القيامة</div><div id="sub"></div></div><div id="pg"></div></div></div>
<div id="pages"></div>
<div id="bar"><button id="b" aria-label="play">
 <span id="fill"></span><span id="sheen"></span>
 <span id="ico">
  <svg class="ic play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  <svg class="ic stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
 </span></button></div>
<script src="surah.js"></script>
<script>
const pagesEl=document.getElementById('pages'),b=document.getElementById('b'),fill=document.getElementById('fill'),sub=document.getElementById('sub'),pg=document.getElementById('pg');
const ar=n=>Number(n).toLocaleString('ar-EG');
const ws=[];
SURAH.verses.forEach(v=>{
  v.text_uthmani.split(' ').forEach(t=>{const s=document.createElement('span');s.className='w';s.textContent=t;ws.push(s)});
  const n=document.createElement('span');n.className='w';n.textContent='﴿'+ar(v.verse_key.split(':')[1])+'﴾';ws.push(n);
});
sub.textContent='الجزء '+ar(29)+' · '+ar(SURAH.verses.length)+' آية';
let pages=[],i=-1,t=null,size=26,curPage=0,lastP=-1,lock=0;

function newPage(){
  const el=document.createElement('div');el.className='page';
  const g=document.createElement('div');g.className='g';
  const inner=document.createElement('div');inner.className='inner';
  el.appendChild(g);el.appendChild(inner);pagesEl.appendChild(el);
  const p={el,g,inner,avail:el.clientHeight-12};
  pages.push(p);return p;
}
function updCount(){pg.textContent=ar(curPage+1)+' / '+ar(pages.length)}
function updProg(){fill.style.width=(i<0?0:((i+1)/ws.length)*100)+'%'}
function place(anim,instant){
  const w=ws[i];
  pages.forEach((p,k)=>{if(!w||k!==w._p)p.g.style.opacity=0});
  if(!w)return;
  const p=pages[w._p],g=p.g,same=(w._p===lastP);
  g.style.transition=(anim&&same)?'':'none';
  g.style.left=(w.offsetLeft-4)+'px';
  g.style.top=(w.offsetTop-2)+'px';
  g.style.width=(w.offsetWidth+8)+'px';
  g.style.height=(w.offsetHeight+4)+'px';
  if(instant||same){g.style.opacity=1}
  else{requestAnimationFrame(()=>{g.style.transition='opacity .4s ease';g.style.opacity=1})}
  lastP=w._p;
}
function paginate(){
  const anchor=i>=0?i:Math.max(0,ws.findIndex(w=>w._p===curPage));
  lock=Date.now()+400;
  pagesEl.textContent='';pages=[];lastP=-1;
  pagesEl.style.fontSize=size+'px';
  let page=newPage();
  ws.forEach(s=>{
    page.inner.appendChild(s);
    if(page.inner.offsetHeight>page.avail&&page.inner.children.length>1){
      page.inner.removeChild(s);page=newPage();page.inner.appendChild(s);
    }
    s._p=pages.length-1;
  });
  pages.forEach(p=>{p.inner.style.marginTop=Math.max(0,(p.avail-p.inner.offsetHeight)/2)+'px'});
  curPage=ws[Math.min(anchor,ws.length-1)]._p;
  pages[curPage].el.scrollIntoView({inline:'center',block:'nearest'});
  place(false,true);updCount();updProg();
}
function showPage(k){
  curPage=k;lock=Date.now()+700;updCount();
  pages[k].el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function stop(){clearInterval(t);t=null;b.classList.remove('playing')}
function go(){
  if(i>=0)ws[i].classList.remove('on');
  i++;
  if(i>=ws.length){stop();i=-1;place(false);updProg();return}
  ws[i].classList.add('on');
  if(ws[i]._p!==curPage&&Date.now()>lock)showPage(ws[i]._p);
  place(true);updProg();
}
b.onclick=()=>{
  if(t){stop();return}
  if(i<0){i=ws.findIndex(w=>w._p===curPage)-1}
  b.classList.add('playing');go();t=setInterval(go,800);
};
let rafS=0;
pagesEl.addEventListener('scroll',()=>{
  cancelAnimationFrame(rafS);
  rafS=requestAnimationFrame(()=>{
    if(Date.now()<lock)return;
    const k=Math.round(Math.abs(pagesEl.scrollLeft)/pagesEl.clientWidth);
    if(k!==curPage&&k<pages.length){curPage=k;updCount()}
  });
});
let d0=0,s0=26,raf=0;
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
document.addEventListener('touchstart',e=>{if(e.touches.length==2){d0=dist(e);s0=size}},{passive:true});
document.addEventListener('touchmove',e=>{
  if(e.touches.length==2){
    e.preventDefault();
    size=Math.max(16,Math.min(64,s0*dist(e)/d0));
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;paginate()});
  }
},{passive:false});
window.addEventListener('resize',paginate);
paginate();
</script></body></html>
